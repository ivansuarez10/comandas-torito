<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pedidos · El Torito Carnicería</title>
<link rel="icon" type="image/png" href="assets/torito-icon.png">
<link rel="apple-touch-icon" href="assets/torito-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#9F2629">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pedidos El Torito">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --rojo:#9F2629; --rojo-d:#7E1E21; --rojo-l:#B83A3D;
  --negro:#1D1D1F; --carbon:#2C2C2E;
  --bg:#F5F5F7; --card:#FFFFFF; --line:#E6E6EB; --line-2:#F0F0F4;
  --ink:#1D1D1F; --muted:#6E6E73; --muted-2:#9A9AA0;
  --ok:#2E7D52; --warn:#C77A12; --paid:#1F6B45;
  --r:16px; --r-s:12px;
  --sh:0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.05);
  --sh-card:0 1px 3px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  --sh-l:0 12px 44px rgba(0,0,0,.16);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none} /* sin pull-to-refresh accidental al deslizar el tablero */
body{font-family:var(--font),system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.45}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:16px}
.disp{font-family:var(--font),sans-serif}
.up{text-transform:uppercase;letter-spacing:.04em}
.hidden{display:none!important}

/* ---------- LOGIN ---------- */
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(120% 80% at 50% -10%, #221C18 0%, var(--negro) 60%)}
.login-card{width:100%;max-width:380px;text-align:center;color:#fff}
.login-badge{width:138px;height:138px;border-radius:50%;margin:0 auto 22px;display:block;
  box-shadow:0 0 0 4px rgba(159,38,41,.35), 0 18px 50px rgba(0,0,0,.5)}
.login-card h1{font-family:var(--font);font-weight:600;font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:#E9E2D6}
.login-card .sub{color:#9b9189;font-size:12.5px;margin-top:4px;letter-spacing:.04em}
.roles{display:flex;gap:10px;margin:26px 0 18px}
.role-btn{flex:1;padding:16px 10px;border-radius:var(--r);background:rgba(255,255,255,.05);
  border:1.5px solid rgba(255,255,255,.12);color:#cfc7bd;transition:.15s;text-align:center}
.role-btn .ri{font-size:24px;display:block;margin-bottom:6px}
.role-btn .rt{display:block;font-family:var(--font);text-transform:uppercase;letter-spacing:.06em;font-size:14px;font-weight:600}
.role-btn .rd{display:block;font-size:11px;color:#8c8378;margin-top:2px}
.role-btn.sel{background:var(--rojo);border-color:var(--rojo-l);color:#fff;box-shadow:0 8px 24px rgba(159,38,41,.4)}
.role-btn.sel .rd{color:#f4d7d8}
.pin-wrap{text-align:left;margin-top:6px}
.pin-wrap label{font-size:12px;color:#9b9189;letter-spacing:.04em;margin-bottom:7px;display:block}
.pin-input{width:100%;padding:15px 16px;border-radius:var(--r);background:rgba(255,255,255,.06);
  border:1.5px solid rgba(255,255,255,.14);color:#fff;font-size:22px;letter-spacing:.5em;text-align:center;font-family:var(--font)}
.pin-input::placeholder{letter-spacing:.3em;color:#6b635a;font-size:16px}
.pin-input:focus{outline:none;border-color:var(--rojo-l);background:rgba(159,38,41,.12)}
.login-go{width:100%;margin-top:16px;padding:15px;border-radius:var(--r);background:#fff;color:var(--negro);
  font-family:var(--font);text-transform:uppercase;letter-spacing:.08em;font-weight:600;font-size:15px;transition:.15s}
.login-go:active{transform:scale(.99)}
.login-err{color:#F2A2A4;font-size:13px;margin-top:12px;min-height:18px}
.login-hint{margin-top:20px;font-size:11px;color:#6b635a;letter-spacing:.03em}

/* ---------- APP SHELL ---------- */
.app{min-height:100%;display:flex;flex-direction:column}
.topbar{background:var(--negro);color:#fff;display:flex;align-items:center;gap:12px;padding:11px 16px;
  position:sticky;top:0;z-index:30;padding-top:max(11px,env(safe-area-inset-top))}
.topbar .badge{width:34px;height:34px;border-radius:50%;flex:none}
.topbar .tb-name{font-family:var(--font);font-weight:600;text-transform:uppercase;letter-spacing:.1em;font-size:15px;line-height:1}
.topbar .tb-sub{font-size:10.5px;color:#9b9189;letter-spacing:.14em;text-transform:uppercase}
.tb-spacer{flex:1}
.tb-pill{font-size:11px;background:rgba(255,255,255,.1);padding:5px 10px;border-radius:999px;display:flex;align-items:center;gap:6px;color:#d9d2c8}
.tb-dot{width:7px;height:7px;border-radius:50%;background:#49C77F;box-shadow:0 0 0 3px rgba(73,199,127,.2)}
.tb-out{font-size:12px;color:#cfc7bd;padding:6px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.14)}

.layout{flex:1;display:flex;min-height:0}
.sidebar{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.view{padding:16px;max-width:1180px;width:100%;margin:0 auto;flex:1}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.view-head h2{font-family:var(--font);font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:24px}
.view-head .vh-sub{color:var(--muted);font-size:13px;margin-top:2px}

/* bottom nav (mobile) */
.botnav{position:sticky;bottom:0;z-index:30;display:flex;background:#fff;border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.botnav button{flex:1;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted-2);font-size:10.5px;font-weight:600}
.botnav button .bi{font-size:21px;line-height:1}
.botnav button.act{color:var(--rojo)}
.botnav .fab{flex:none;width:58px;margin:-14px 6px 0;background:var(--rojo);color:#fff;border-radius:50%;height:58px;
  box-shadow:0 8px 20px rgba(159,38,41,.45);justify-content:center}
.botnav .fab .bi{font-size:26px}

/* ---------- CARDS / UI ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:var(--r-s);
  font-weight:600;font-size:14px;background:var(--ink);color:#fff;transition:.12s}
.btn:active{transform:scale(.98)}
.btn.red{background:var(--rojo)}.btn.red:hover{background:var(--rojo-d)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.green{background:var(--ok)}
.btn.lg{padding:15px 20px;font-size:15px;font-family:var(--font);text-transform:uppercase;letter-spacing:.05em}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:13px}
.btn[disabled]{opacity:.4;pointer-events:none}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;padding:4px 9px;border-radius:999px;font-family:var(--font)}
.chip.nueva{background:#ECE7DE;color:#6b635a}
.chip.cotizar{background:#F3E6CB;color:#7A5410}
.chip.espera{background:#E1E6EB;color:#46515D}
.chip.prep{background:#F6E2E2;color:#8E2326}
.chip.lista{background:#DDEBE3;color:#27543F}
.chip.ruta{background:#EFE6D6;color:#7A5410}
.chip.entregada{background:#E6EAE6;color:#566256}
.chip.cancel{background:#F3DADA;color:#9a3030}
.chip.noname{background:#F6E7C9;color:#8A5A11;letter-spacing:.01em}
/* Cliente que además se hizo cuenta en la tienda web. Neutro a propósito: no es un
   estado del pedido, así que no compite con los chips de la comanda. */
.chip.webacc{background:#E3E9F2;color:#33465C;letter-spacing:.01em}
.carn-info.namebanner{background:#FBF1DA;border-color:#EAD9AC;color:#8A5A11}
.carn-info.namebanner b{color:#7A4E0C}
.btn.amber{background:#F6E7C9;color:#8A5A11;border:1px solid #EAD9AC;box-shadow:none}
.btn.amber:hover{background:#F2DDB2}
.cli-card.unnamed{border:1px solid #EAD9AC;background:#FEFBF3}
.cli-name-cta{margin-top:9px;display:flex;align-items:center;gap:6px;color:#8A5A11;font-size:12.5px;font-weight:700}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.sect-label{font-family:var(--font);text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--muted);
  font-weight:600;margin:18px 2px 9px;display:flex;align-items:center;gap:8px}
.sect-label .cnt{background:var(--rojo);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;font-family:var(--font)}

/* order list cards (admin) */
.olist{display:grid;gap:10px}
.ocard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;box-shadow:var(--sh);
  display:flex;align-items:center;gap:13px;text-align:left;width:100%;transition:.12s}
.ocard:active{transform:scale(.995)}
.ocard:hover{border-color:#d6cdbf}
.ocard .folio{font-family:var(--font);font-weight:700;font-size:15px;color:var(--rojo);width:46px;flex:none}
.ocard .obody{flex:1;min-width:0}
.ocard .oname{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ocard .ometa{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.ocard .oright{text-align:right;flex:none}
.ocard .ototal{display:block;font-family:var(--font);font-weight:600;font-size:16px}
.ocard .otime{display:block;font-size:11px;color:var(--muted-2);margin-top:2px}

/* ---------- KANBAN ---------- */
.kanban-wrap{flex:1;overflow:hidden;display:flex;flex-direction:column}
.kanban{display:flex;gap:12px;padding:14px;overflow-x:auto;flex:1;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.kcol{flex:0 0 86%;max-width:340px;scroll-snap-align:center;background:#ECE7DF;border-radius:var(--r);
  display:flex;flex-direction:column;min-height:0;max-height:100%}
.kcol-head{padding:12px 14px 10px;display:flex;align-items:center;gap:8px;position:sticky;top:0}
.kcol-head .kn{font-family:var(--font);text-transform:uppercase;letter-spacing:.05em;font-weight:600;font-size:14px}
.kcol-head .kc{margin-left:auto;background:rgba(0,0,0,.1);border-radius:999px;font-size:12px;padding:1px 9px;font-weight:700}
.kcol.c1{background:#FBF0D9}.kcol.c1 .kn{color:#8a5a06}
.kcol.c2{background:#EBE3F4}.kcol.c2 .kn{color:#6b3fa0}
.kcol.c3{background:#DEECF6}.kcol.c3 .kn{color:#1f5f8a}
.kcol.c4{background:#DCF0E4}.kcol.c4 .kn{color:#1f6b45}
.kcol-body{padding:0 10px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:9px}
.kcard{background:#fff;border-radius:12px;padding:13px;box-shadow:0 2px 6px rgba(20,17,15,.1);text-align:left;width:100%;border:1px solid rgba(0,0,0,.04)}
.kcard:active{transform:scale(.98)}
.kcard.locked{opacity:.62;filter:grayscale(.3)}
.kcard .kf{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.kcard .kfolio{font-family:var(--font);font-weight:700;color:var(--rojo);font-size:14px}
.kcard .kname{font-weight:600;font-size:15px}
.kcard .kitems{font-size:12.5px;color:var(--muted);margin-top:2px}
.kcard .ktime{font-size:11px;color:var(--muted-2);margin-top:7px}
.kcard .kbtn{margin-top:10px;width:100%;padding:11px;border-radius:9px;font-family:var(--font);text-transform:uppercase;
  letter-spacing:.05em;font-weight:600;font-size:14px;background:var(--ink);color:#fff}
.kcard .kbtn.amber{background:#C77A12}.kcard .kbtn.blue{background:#1f5f8a}.kcard .kbtn.green{background:#1f6b45}
.kcard .klock{margin-top:9px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;font-weight:600}
.kempty{text-align:center;color:var(--muted-2);font-size:12.5px;padding:18px 8px}

/* ---------- OVERLAY / DETAIL ---------- */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(20,16,14,.5);display:flex;align-items:flex-end;justify-content:center;
  backdrop-filter:blur(2px)}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:94vh;border-radius:20px 20px 0 0;overflow-y:auto;
  box-shadow:var(--sh-l);animation:up .22s ease}
@keyframes up{from{transform:translateY(20px);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{position:sticky;top:0;background:var(--negro);color:#fff;padding:19px 18px 15px;display:flex;align-items:center;gap:12px;z-index:2;user-select:none;-webkit-user-select:none;touch-action:none;cursor:grab}
.sheet-head:active{cursor:grabbing}
/* Grabber: barrita que avisa que la hoja se arrastra para cerrar (manos grasosas) */
.sheet-head::before{content:"";position:absolute;top:7px;left:50%;transform:translateX(-50%);width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.3);pointer-events:none}
.sheet-head .sh-folio{font-family:var(--font);font-weight:700;color:#fff;font-size:18px}
.sheet-head .sh-name{font-weight:600;font-size:14px;color:#e9e2d6}
.sheet-head .x{margin-left:auto;font-size:15px;color:#cfc7bd;width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.1);flex:none}
.sheet-body{padding:16px 18px 26px}

.line{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px}
.line.unavail{background:#FAF1F1;border-color:#EBD2D2}
.line-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.line-name{font-weight:600;font-size:15px}
.line-tag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--rojo);
  background:#F6E7E7;padding:2px 7px;border-radius:6px;font-family:var(--font);margin-left:6px;vertical-align:middle}
.line-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.line-amt{font-family:var(--font);font-weight:600;font-size:17px;white-space:nowrap}
.weigh-row{display:flex;align-items:center;gap:10px;margin-top:11px;flex-wrap:wrap}
.weigh-row .wlab{font-size:12.5px;color:var(--muted);font-weight:600}
.win{width:92px;padding:11px;border:1.5px solid var(--line);border-radius:10px;font-size:18px;text-align:center;font-family:var(--font);background:#fff}
.win:focus{outline:none;border-color:var(--rojo);background:#fff}
.calc{font-size:13px;color:var(--muted)}
.calc b{color:var(--ink);font-family:var(--font);font-size:15px}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:8px 12px;border-radius:999px;
  border:1.5px solid var(--line);background:#fff;color:var(--ok)}
.toggle.off{color:#b03a3a;border-color:#e7c9c9;background:#FBF1F1}
.toggle .sw{width:34px;height:20px;border-radius:999px;background:var(--ok);position:relative;transition:.15s}
.toggle.off .sw{background:#cf9a9a}
.toggle .sw::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;right:2px;transition:.15s}
.toggle.off .sw::after{right:auto;left:2px}

.total-bar{display:flex;justify-content:space-between;align-items:center;background:var(--negro);color:#fff;
  border-radius:12px;padding:14px 16px;margin:14px 0}
.total-bar .tl{font-family:var(--font);text-transform:uppercase;letter-spacing:.06em;font-size:13px;color:#cfc7bd}
.total-bar .tv{font-family:var(--font);font-weight:600;font-size:24px}

.msgbox{background:#fff;border:1.5px dashed var(--line);border-radius:12px;padding:13px;font-size:13.5px;
  white-space:pre-wrap;color:#33302c;line-height:1.5;margin-top:8px;font-family:var(--font)}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line-2);font-size:13.5px}
.kv:last-child{border:none}.kv .k{color:var(--muted)}.kv .v{font-weight:600;text-align:right}
.copied{color:var(--ok);font-size:12.5px;font-weight:600;margin-left:8px}

/* ---------- NUEVA COMANDA ---------- */
.field{margin-bottom:13px}
/* Autocompletar cliente por nombre en Nueva comanda */
.cli-field{position:relative}
.cli-sug{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--card);border:1px solid var(--line);border-radius:12px;overflow-y:auto;z-index:50;box-shadow:0 14px 34px rgba(0,0,0,.14);max-height:262px}
.cli-sug[hidden]{display:none}
.cli-sug button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line-2);padding:12px 13px;cursor:pointer;font-family:inherit}
.cli-sug button:last-child{border-bottom:none}
.cli-sug button:active{background:var(--line-2)}
.cli-sug .cs-nm{font-weight:600;font-size:14.5px;color:var(--ink)}
.cli-sug .cs-sub{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.cli-sug .cs-ic{flex:none;color:var(--muted-2)}
.cli-sug .cs-t{min-width:0;flex:1}
.field label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.03em;display:block;margin-bottom:6px}
.inp{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:16px} /* ≥16px: evita el auto-zoom al enfocar en móvil */
.inp:focus{outline:none;border-color:var(--rojo)}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{border-color:var(--rojo);background:#FBF1F1;color:var(--rojo)}
.cat-tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;-webkit-overflow-scrolling:touch}
.cat-tabs button{flex:none;padding:8px 14px;border-radius:999px;background:#fff;border:1.5px solid var(--line);
  font-size:13px;font-weight:600;color:var(--muted);font-family:var(--font);text-transform:uppercase;letter-spacing:.03em}
.cat-tabs button.on{background:var(--negro);color:#fff;border-color:var(--negro)}
.prod-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:300px;overflow-y:auto;padding:2px}
.pchip{background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:10px 11px;text-align:left;transition:.1s}
.pchip:active{transform:scale(.97);border-color:var(--rojo)}
.pchip .pn{font-weight:600;font-size:13.5px;line-height:1.2}
.pchip .pp{font-size:12px;color:var(--rojo);font-family:var(--font);font-weight:600;margin-top:3px}
.pchip .pu{font-size:10.5px;color:var(--muted-2)}
.cartline{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:7px}
.cartline .cn{flex:1;min-width:0}
.cartline .cn b{font-weight:600;font-size:14px}
.cartline .cn small{display:block;color:var(--muted);font-size:11.5px}
.qty{display:flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:9px;overflow:hidden}
.qty button{width:32px;height:34px;background:#F5F1EA;font-size:18px;font-weight:600;color:var(--ink)}
.qty input{width:46px;height:34px;border:none;text-align:center;font-size:16px;font-family:var(--font);border-left:1.5px solid var(--line);border-right:1.5px solid var(--line)}
.qty input:focus{outline:none}
.cartline .rm{color:var(--muted-2);font-size:18px;width:30px;height:30px}
.cart-empty{text-align:center;color:var(--muted-2);font-size:13px;padding:22px;border:1.5px dashed var(--line);border-radius:12px}

/* catalogo */
.cat-table{width:100%;border-collapse:collapse;background:#fff;border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.cat-table th{font-family:var(--font);text-transform:uppercase;letter-spacing:.04em;font-size:11.5px;color:var(--muted);
  text-align:left;padding:10px 12px;background:#FAF7F2;border-bottom:1px solid var(--line)}
.cat-table td{padding:10px 12px;border-bottom:1px solid var(--line-2);font-size:13.5px}

.carn-tabs{display:none}
@media(max-width:899px){

  .ctab{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 11px;font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .ctab:active{opacity:.7}
  .ctab-l{font-size:11.5px;font-weight:700;letter-spacing:.01em;color:#b0a89e}
  .ctab.on .ctab-l{color:#fff}
  .ctab-c{min-width:22px;height:20px;padding:0 6px;border-radius:999px;background:rgba(255,255,255,.13);color:#ccc4b9;font-size:12.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;line-height:1;transition:background .15s}
  .ctab-c.has{background:var(--rojo);color:#fff}
  /* el subrayado NO tiene transición: sigue el scrollLeft 1:1 (swipe o deslizar suave al tocar tab) */
  .ctab-ind{position:absolute;left:0;bottom:0;width:25%;height:3px;border-radius:3px 3px 0 0;background:var(--rojo);transform:translateX(0);pointer-events:none;will-change:transform}
  /* cada estación llena la pantalla; el swipe hace snap a pantalla completa */
  #carnKanban{gap:0;padding:0;scroll-padding:0}
  #carnKanban > .kcol{flex:0 0 100%;max-width:none;border-radius:0;scroll-snap-align:center;height:100%;max-height:100%}
  #carnKanban > .kcol .kcol-head{padding-top:14px}
  /* VISTA CARNICERO CLAVADA A LA PANTALLA: header + tabs + estación = 100dvh exacto.
     Solo la lista de comandas (.kcol-body) scrollea; la página NO. Así se acaba el "más
     allá" horizontal y el vacío scrolleable de abajo — se siente app, no web. */
  body.carn-mode{overflow:hidden}
  body.carn-mode #app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
  body.carn-mode .ctop{flex:none}
  body.carn-mode .kanban-wrap{flex:1;min-height:0}
  body.carn-mode .kanban{min-height:0}
  body.carn-mode #carnKanban > .kcol .kcol-body{flex:1;min-height:0}
}

.ocard .folio,.kfolio,.sh-folio{color:var(--rojo)}
/* kanban light (iOS grouped) */
.kcol,.kcol.c1,.kcol.c2,.kcol.c3,.kcol.c4{background:rgba(237,237,241,.78);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);border-top:none;border-radius:22px}
.kcol-head{padding:15px 16px 9px}
.kcard2{border:none;box-shadow:var(--sh-card);border-radius:18px}
.kmv{background:#EFEFF3;color:var(--ink);border:none;box-shadow:none}
.kmv.fwd{background:var(--rojo);color:#fff;box-shadow:0 6px 16px rgba(159,38,41,.26)}
.kmv.del{background:#fff;color:#C0392B;border:.5px solid #F1D2D2;box-shadow:var(--sh)}
.knote{background:#F3F3F6;color:var(--muted);border-radius:12px}
.kpaid{color:var(--paid)} .kwait{color:var(--muted)}
.chip{border-radius:8px;font-family:var(--font);letter-spacing:.01em}
/* total bar light */
.total-bar{background:#fff;border:.5px solid var(--line);box-shadow:var(--sh-card);border-radius:18px}
.total-bar .tl{color:var(--muted);letter-spacing:0;text-transform:none;font-weight:500}
.total-bar .tv{color:var(--ink)}
/* sheets (iOS modal) */
.sheet{background:var(--bg);border-radius:24px 24px 0 0}
.sheet-head{background:rgba(255,255,255,.72);-webkit-backdrop-filter:saturate(200%) blur(24px);backdrop-filter:saturate(200%) blur(24px);color:var(--ink);border-bottom:.5px solid var(--line)}
/* Vibrancy web: sobre el vidrio el texto va más contrastado y con peso, no gris plano */
.sheet-head::before{background:rgba(60,60,67,.32)}
.sheet-head .sh-folio{color:var(--ink);letter-spacing:-.01em}
.sheet-head .sh-name{color:var(--ink);opacity:.72;font-weight:600;letter-spacing:.004em}
.sheet-head .x{background:rgba(120,120,128,.16);color:var(--ink)}
.note-banner{background:#fff;border:.5px solid var(--line);box-shadow:var(--sh);border-radius:14px}
/* buttons apple */
.btn{border-radius:13px;box-shadow:var(--sh);font-weight:600}
.btn.red{box-shadow:0 6px 18px rgba(159,38,41,.24)}
.btn.green{box-shadow:0 6px 18px rgba(46,125,82,.22)}
.btn.ghost{border:.5px solid var(--line);box-shadow:var(--sh)}
.btn.lg{border-radius:15px;text-transform:none;letter-spacing:-.01em;font-weight:700}
/* edit numbox */
.numbox{border:1.5px solid var(--line);box-shadow:var(--sh);background:#fff;border-radius:14px}
.numbox.active{border-color:var(--rojo);box-shadow:0 0 0 4px rgba(159,38,41,.12)}
/* Peso pendiente de validar: borde rojo para que el carnicero lo actualice antes de pasar a pago */
.numbox.needw{border-color:var(--rojo);background:#FBF1F1;box-shadow:0 0 0 3px rgba(159,38,41,.14);animation:needwPulse 1.6s ease-in-out infinite}
.numbox.needw.active{animation:none}
@keyframes needwPulse{0%,100%{box-shadow:0 0 0 3px rgba(159,38,41,.14)}50%{box-shadow:0 0 0 5px rgba(159,38,41,.22)}}
html.lite .numbox.needw{animation:none}
/* CONFIRMAR DE UN TOQUE lo que no se pesa (fase cotizar): pendiente = ámbar; confirmado = verde. */
.okbox{display:inline-flex;align-items:center;gap:7px;padding:12px 16px;border-radius:13px;font-family:var(--font);font-weight:800;font-size:15px;cursor:pointer;
  border:1.5px solid #EAD9AC;background:#FBF1DA;color:#8A5A11;box-shadow:0 0 0 3px rgba(184,134,20,.12);animation:needcPulse 1.8s ease-in-out infinite}
.okbox:active{transform:scale(.97)}
.okbox.on{border-color:transparent;background:var(--ok);color:#fff;box-shadow:0 3px 10px rgba(46,125,82,.22);animation:none}
@keyframes needcPulse{0%,100%{box-shadow:0 0 0 3px rgba(184,134,20,.12)}50%{box-shadow:0 0 0 5px rgba(184,134,20,.20)}}
html.lite .okbox{animation:none}
.confirm-all{width:100%;padding:14px;border:1.5px solid #EAD9AC;border-radius:14px;background:#FBF1DA;color:#8A5A11;font-weight:800;font-size:15px;margin:2px 0 12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.confirm-all:active{background:#F2DDB2}
html.bigtext .okbox{font-size:16.5px}
/* Aviso: otro dispositivo tiene la MISMA comanda abierta (co-edición) */
.coedit-warn{display:flex;align-items:center;gap:8px;background:#FBF1DA;border:1px solid #EAD9AC;color:#8A5A11;border-radius:11px;padding:10px 12px;margin-bottom:12px;font-size:13.5px;font-weight:700;line-height:1.3}
.coedit-warn svg{flex:none}
html.bigtext .coedit-warn{font-size:15px}
/* EN VIVO: un carnicero tiene la comanda abierta ahora (visto desde el admin) */
.klive{display:flex;align-items:center;gap:7px;color:#1f8f4d;font-size:12.5px;font-weight:700;margin-top:8px}
.live-dot{width:9px;height:9px;border-radius:50%;background:#25c460;flex:none;box-shadow:0 0 0 0 rgba(37,196,96,.5);animation:livePulse 1.4s ease-out infinite}
@keyframes livePulse{0%{box-shadow:0 0 0 0 rgba(37,196,96,.5)}70%{box-shadow:0 0 0 7px rgba(37,196,96,0)}100%{box-shadow:0 0 0 0 rgba(37,196,96,0)}}
.kcard2.islive{border-color:#bfe8cf}
html.lite .live-dot{animation:none}
/* Recordatorios (Resumen admin): comandas atascadas demasiado tiempo */
.rem-row{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:#FBF1DA;border:1px solid #EAD9AC;border-radius:12px;padding:11px 13px;margin-bottom:8px;cursor:pointer;color:#8A5A11}
.rem-row:active{background:#F2DDB2}
.rem-row svg{flex:none}
.rem-row .rem-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.rem-row .rem-tx b{color:var(--ink);font-size:14px}
.rem-row .rem-tx small{color:#8A5A11;font-size:12.5px;font-weight:600}
/* TEXTO GRANDE / ALTO CONTRASTE — lectura a distancia en el mostrador (toggle en Ajustes) */
html.bigtext{--muted:#48484D;--muted-2:#55555A}
html.bigtext .kcol-head .kn{font-size:16px}
html.bigtext .kcard .kname,html.bigtext .kcard2 .kname{font-size:19px}
html.bigtext .kcard2 .kitems{font-size:15px}
html.bigtext .kfolio,html.bigtext .kcard .kfolio{font-size:16px}
html.bigtext .oitem-name{font-size:17px}
html.bigtext .oitem-sub{font-size:14px}
html.bigtext .line-tag{font-size:11.5px}
html.bigtext .lbl{font-size:13.5px}
html.bigtext .numbox{font-size:26px}
html.bigtext .oitem-amt,html.bigtext .line-amt{font-size:19px}
html.bigtext .cmt-area{font-size:16px}
.add-prod{border:1.5px dashed var(--line);border-radius:16px;box-shadow:none}
/* numpad popup LIGHT (iOS keypad) */
.np-scrim{background:rgba(0,0,0,.38)} /* sin blur de pantalla completa: caro en Android, hacía lento abrir el numpad */
.np-pop{background:rgba(250,250,252,.96);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);border:.5px solid rgba(0,0,0,.06);border-radius:30px;box-shadow:0 26px 80px rgba(0,0,0,.34)}
.np-label{color:var(--muted)}
.np-val{color:var(--ink)}
.np-key{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08);border-radius:16px;font-weight:600;font-family:var(--font)}
.np-key:active{background:#ECECEF;transform:scale(.96)}
.np-key.del{background:#E8E8ED;color:var(--ink)}
.np-key.ok{background:var(--rojo);color:#fff;box-shadow:0 8px 20px rgba(159,38,41,.3)}
/* nav light */
.botnav{background:rgba(255,255,255,.88);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line)}
.botnav .fab{box-shadow:0 10px 26px rgba(159,38,41,.38)}
.sidebar{background:#fff;border-right:.5px solid var(--line)}
.sidebar .snew{box-shadow:0 6px 16px rgba(159,38,41,.24)}
/* tables/segments */
.cat-table .catrow td{background:#F2F2F6;color:var(--ink);letter-spacing:.04em}
.cat-tabs button.on,.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.confirm-box{border-radius:26px;box-shadow:var(--sh-l)}
.kpi .kvv,.view-head h2{letter-spacing:-.02em}
.kmv.go{background:var(--ok);color:#fff;box-shadow:0 6px 16px rgba(46,125,82,.22)}
.cmt-field{margin:4px 0 16px}
.cmt-label{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--muted);font-weight:600;margin-bottom:8px}
.cmt-label svg{color:var(--rojo)}
.cmt-opt{font-weight:600;font-size:12px;color:var(--muted-2);text-transform:none}
/* Editor de mensaje (Ajustes del negocio) */
.msg-tpl{width:100%;resize:vertical;min-height:90px;font-size:15px;line-height:1.5;padding:13px 14px;border-radius:14px;box-shadow:var(--sh);white-space:pre-wrap}
/* Chip de modo de entrega (retiro/domicilio) en las tarjetas */
.kdtag{margin-top:6px}
.dtag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;letter-spacing:.02em;padding:3px 9px;border-radius:999px}
.dtag.retiro{background:#EAF0F5;color:#3f566b}
.dtag.domi{background:#F5EEE7;color:#8a5a34}
.dtag svg{width:12px;height:12px}
/* Retiro EN PAUSA (esperando al cliente): tarjeta atenuada + banner ámbar "EN ESPERA · recoge hora" */
.kcard2.held{opacity:.86;background:#FCFAF4}
.khold{margin-top:7px;display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;letter-spacing:.02em;color:#9a6a12;background:#FBF3DE;border-radius:9px;padding:6px 9px;text-transform:uppercase}
.khold svg{width:14px;height:14px;flex:none}
#bizPrev{white-space:pre-wrap}
/* Navegador de día en el Resumen (flechas ‹ fecha ›) */
.res-datenav{display:flex;align-items:center;justify-content:center;gap:16px;margin:2px 0 16px}
.rdn-lbl{font-family:var(--font);font-size:16px;font-weight:700;color:var(--ink);text-transform:capitalize;min-width:150px;text-align:center;letter-spacing:-.01em}
.daynav{flex:none;width:44px;height:44px;border-radius:13px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);color:var(--ink);display:inline-flex;align-items:center;justify-content:center}
.daynav:disabled{opacity:.3}
html.bigtext .rdn-lbl{font-size:18px}
/* Encabezado de categoría dentro de la comanda (agrupado Res/Cerdo/Pollo/...) */
.ocat-head{display:flex;align-items:center;gap:10px;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted-2);margin:18px 2px 9px}
.ocat-head::after{content:'';flex:1;height:1px;background:var(--line)}
#oitems .ocat-head:first-child{margin-top:2px}
html.bigtext .ocat-head{font-size:13px;color:var(--muted)}
.cmt-area{width:100%;resize:none;font-size:15px;line-height:1.45;padding:13px 14px;border-radius:14px;box-shadow:var(--sh)}
.cmt-area:focus{outline:none;border-color:var(--rojo);box-shadow:0 0 0 4px rgba(159,38,41,.1)}
/* ===== quick wins ===== */
.toast{display:flex;align-items:center;gap:14px}
.t-undo{display:none;align-items:center;background:transparent;border:none;color:#FF7A7A;font-weight:700;font-size:14px;padding:2px 2px;cursor:pointer}
.ctop-snd{flex:none;width:38px;height:38px;border-radius:11px;border:.5px solid var(--line);background:#fff;box-shadow:var(--sh);color:var(--muted-2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.ctop-snd.on{color:var(--rojo)}
.kdot{width:9px;height:9px;border-radius:50%;background:var(--rojo);flex:none;animation:kpulse 1.6s ease-in-out infinite}
@keyframes kpulse{0%,100%{box-shadow:0 0 0 0 rgba(159,38,41,.45)}50%{box-shadow:0 0 0 6px rgba(159,38,41,0)}}
.kcol.alerted{animation:colflash .9s ease 2}
@keyframes colflash{0%,100%{box-shadow:none}50%{box-shadow:0 0 0 3px rgba(159,38,41,.4)}}
.kcard2.urgent{box-shadow:0 1px 3px rgba(0,0,0,.05),0 10px 26px rgba(159,38,41,.16)}
.ktime.urg{color:var(--rojo);font-weight:700;display:inline-flex;align-items:center;gap:4px}
.kempty{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted-2);font-size:13.5px;padding:34px 12px;font-weight:500}
.ke-ic{color:#CACAD0}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
/* ===== dashboard ===== */
.kpi.accent{background:var(--rojo)}
.kpi.accent .kl{color:#f3d2d3} .kpi.accent .kvv{color:#fff}
.act-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:4px}
.act-card{background:#fff;border:.5px solid var(--line);border-radius:16px;box-shadow:var(--sh-card);padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:transform .12s}
.act-card:active{transform:scale(.97)}
.act-ic{color:var(--rojo)}
.act-n{font-weight:800;font-size:24px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.act-l{font-size:12px;color:var(--muted);font-weight:500;text-align:center}
.link-btn{margin-left:auto;background:transparent;border:none;color:var(--rojo);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:2px;cursor:pointer;text-transform:none;letter-spacing:0}
.chart-card{padding:16px 16px 12px}
.chart-top{margin-bottom:14px}
.chart-top .kl{margin-bottom:2px}
.chart-big{font-weight:800;font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.chart{display:flex;align-items:flex-end;gap:8px;height:120px}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end}
.chart-bar{width:100%;max-width:36px;background:#E4E4EA;border-radius:7px;min-height:3px}
.chart-bar.today{background:var(--rojo)}
.chart-lbl{font-size:11px;color:var(--muted-2);font-weight:600}
.rk-name{flex:none;width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.hist-link{display:flex;align-items:center;gap:13px;padding:15px 16px;cursor:pointer;width:100%;text-align:left}
.hist-tx{flex:1;display:flex;flex-direction:column}
.hist-tx b{font-weight:700;font-size:15px} .hist-tx small{color:var(--muted);font-size:12.5px;margin-top:1px}
.hist-ch{color:var(--muted-2)}
.back-btn{background:transparent;border:none;color:var(--rojo);font-weight:600;font-size:14px;padding:0 0 7px;cursor:pointer;display:inline-flex;align-items:center;gap:3px}
/* histórico: encabezado de día */
.hist-day-head{display:flex;align-items:center;gap:10px;margin:20px 2px 9px}
.hist-day-head .hdh-txt{flex:1;min-width:0}
.hist-day-head .hdh-day{font-family:var(--font);font-weight:800;font-size:16px;color:var(--ink);text-transform:capitalize;letter-spacing:-.01em}
.hist-day-head .hdh-meta{font-size:12.5px;color:var(--muted-2);font-weight:600;margin-top:1px;font-variant-numeric:tabular-nums}
.hist-day-head .hdh-del{flex:none;background:#fff;border:.5px solid #F1D2D2;color:#b03a3a;font-weight:700;font-size:12.5px;padding:8px 12px;border-radius:10px;box-shadow:var(--sh);cursor:pointer;white-space:nowrap}
.hist-day-head .hdh-del:active{background:#FBECEC;transform:scale(.97)}
/* histórico: fila = abrir + eliminar */
.hist-row{display:flex;align-items:stretch;gap:0;padding:0;overflow:hidden}
.hist-row .hist-open{flex:1;min-width:0;display:flex;align-items:center;gap:13px;padding:13px 14px;background:transparent;border:none;text-align:left;cursor:pointer}
.hist-row .hist-del{flex:none;width:52px;display:flex;align-items:center;justify-content:center;border:none;border-left:.5px solid var(--line);background:transparent;color:var(--muted-2);cursor:pointer}
.hist-row .hist-del:active{background:#FBECEC;color:var(--rojo)}
/* ===== línea gráfica: rojo solo como acento (acciones, nav activa, alertas) ===== */
.ocard .folio{color:var(--ink)} .kcard2 .kfolio{color:var(--ink)} .sh-folio{color:var(--ink)}
/* Folios largos (pedidos web, ej. W9198665) no deben encimarse: se ajustan al contenido con tope */
.hist-row .folio{width:auto;min-width:42px;max-width:92px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.sect-label svg{color:var(--muted-2)}
.act-ic{color:var(--muted)} .act-n{color:var(--ink)}
.rank .rbar i{background:#C7C7CC}
.chart-bar{background:#E4E4EA} .chart-bar.today{background:var(--ink)}
.kpi.accent{background:#fff;border:.5px solid var(--line)} .kpi.accent .kl{color:var(--muted)} .kpi.accent .kvv{color:var(--rojo)}
.kcol.c1 .kn,.kcol.c2 .kn,.kcol.c3 .kn,.kcol.c4 .kn{color:var(--muted)}
.kcol.c1 .kc,.kcol.c2 .kc,.kcol.c3 .kc,.kcol.c4 .kc{background:#E4E4EA;color:var(--muted)}
.kcard2 .knote{background:#F0F0F3;color:var(--muted)}
.kcard2 .kpaid,.kcard2 .kwait{color:var(--muted)}
.btn.green{background:var(--rojo);box-shadow:0 6px 18px rgba(159,38,41,.24)}
.kmv.go{background:var(--rojo);box-shadow:0 6px 16px rgba(159,38,41,.22)}
.chip.nueva,.chip.cotizar,.chip.espera,.chip.prep,.chip.lista,.chip.ruta,.chip.entregada,.chip.cancel{background:#ECECEF;color:#6E6E73}
/* ===== caja pegar pedido ===== */
.paste-box{background:#fff;border:.5px solid var(--line);border-radius:16px;box-shadow:var(--sh-card);padding:14px;margin-bottom:16px}
.paste-head{display:flex;align-items:center;gap:7px;font-weight:700;font-size:14px;margin-bottom:9px}
.paste-head svg{color:var(--rojo)}
.paste-area{width:100%;resize:vertical;font-size:15px;line-height:1.45;min-height:72px}
.paste-row{display:flex;gap:10px;margin-top:9px}
.paste-row .inp{flex:1}
.paste-row .btn{flex:none;white-space:nowrap}
/* ===== CAMBIOS ADMIN (jun 30 v3): tablero, catálogo editable, validación autollenar ===== */
/* Bandeja como tablero Trello */
.admin-board{overflow:visible;display:block;margin-top:4px}
.admin-board .kanban{padding:2px 0 16px;overflow-x:auto}
.admin-board .kcol{flex:0 0 80%}
.admin-board .kcol-body{max-height:none}
.admin-board .kcard2{padding:13px 14px 11px;cursor:pointer}
.admin-board .kcard2 .kname{font-size:17px;font-weight:800}
.admin-board .kcard2 .kitems{font-size:13.5px}
.admin-board .kcard2 .kpaid,.admin-board .kcard2 .kwait{font-size:12.5px;margin-top:7px}
.admin-board .kcol.c5 .kn{color:var(--muted)}
.admin-board .kcol.c5 .kc{background:rgba(0,0,0,.06);color:#5a514a}
.admin-board .kmove{margin-top:10px}
.admin-board .kmv{width:auto;flex:1;border:none;border-radius:11px;padding:9px;font-weight:700;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.admin-board .kmv.anav{flex:0 0 42px;padding:9px 0;background:#EFEFF3;color:var(--muted)}
.admin-board .kmv.anav.ghost{visibility:hidden}
.admin-board .kmv.go{background:#2F6B57;color:#fff}
.admin-board .kmv.fwd{background:var(--ink);color:#fff}
@media(min-width:900px){ .admin-board .kanban{grid-template-columns:repeat(5,1fr)} .admin-board .kcol{flex:auto} }
/* Catálogo editable */
.cat-note{background:#FBF1F1;border:1px solid #f0d9d9;border-radius:12px;padding:11px 13px;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:flex-start;margin-bottom:6px}
.cat-note b{color:var(--ink)}
.cat-elist{background:var(--card);border-radius:16px;box-shadow:var(--sh-card);overflow:hidden;margin-bottom:6px}
.cat-erow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:.5px solid var(--line)}
.cat-erow:last-child{border-bottom:none}
.ce-info{flex:1;min-width:0}
.ce-name{font-weight:600;font-size:14.5px;color:var(--ink)}
.ce-unit{font-size:11.5px;color:var(--muted-2);margin-top:1px}
.ce-price{display:flex;align-items:center;gap:5px;background:#F5F5F7;border-radius:10px;padding:6px 10px;flex:none}
.ce-price .ce-l{font-size:13px;color:var(--muted);font-weight:600}
.ce-inp{width:64px;border:none;background:transparent;font-size:15.5px;font-weight:700;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums;outline:none}
.ce-price .ce-u{font-size:11.5px;color:var(--muted-2)}
.ce-price:focus-within{box-shadow:0 0 0 2px var(--rojo) inset;background:#fff}

/* ===== MODO LIGERO (html.lite): apaga efectos pesados en teléfonos de gama media/baja =====
   Quita el borde de luz animado, los desenfoques tipo vidrio, el scroll-snap y las transiciones.
   La GPU/CPU deja de trabajar de fondo → los toques responden al instante y el scroll no salta. */
html.lite *,html.lite *::before,html.lite *::after{animation:none!important;transition:none!important}
html.lite .kcol.urge::before{display:none!important}
html.lite .kdot{display:none!important}

  -webkit-backdrop-filter:none!important;backdrop-filter:none!important;background:#fff!important}
html.lite .np-scrim,html.lite .overlay{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
html.lite .kcol,html.lite .kcol.c1,html.lite .kcol.c2,html.lite .kcol.c3,html.lite .kcol.c4{
  -webkit-backdrop-filter:none!important;backdrop-filter:none!important;background:#ECECEF!important}
html.lite .kanban{scroll-snap-type:none!important}
html.lite .kcard2,html.lite .ocard,html.lite .card,html.lite .oitem,html.lite .kpi{box-shadow:0 1px 2px rgba(0,0,0,.08)!important}

/* ── Foco visible por teclado — WCAG 2.4.7 (AA) ──────────────────────────
   Antes no había ninguna regla :focus-visible y sí 6 con outline:none, así
   que quien navegaba con teclado (iPad con teclado, Tab) no veía dónde
   estaba parado. Estas reglas van AL FINAL de la hoja a propósito: igualan
   la especificidad de las reglas :focus de arriba y ganan por orden de
   cascada. Se usa currentColor para que el anillo se adapte solo a cada
   superficie — oscuro sobre tarjeta clara, claro sobre la barra negra.
   :focus-visible solo se muestra a quien navega con teclado; el ratón y el
   dedo no lo activan, así que el aspecto para el carnicero no cambia. */
:focus-visible{outline:3px solid currentColor;outline-offset:2px;border-radius:4px}
.pin-input:focus-visible,.win:focus-visible,.inp:focus-visible,
.qty input:focus-visible,.ce-inp:focus-visible,.ce-nameinp:focus-visible{
  outline:3px solid currentColor;outline-offset:2px}

<script id="motion">
/* Motion v2 (vanilla, ~1.2 KB): fuse = mecha del Deshacer · num/roll = cifra que rueda · shake = el "no" · háptico al tocar.

window.Mo=(function(){
  var rm=matchMedia('(prefers-reduced-motion: reduce)');
  function re(el,c){ el.classList.remove(c); void el.offsetWidth; el.classList.add(c); }
  function fuse(t,ms,btn){ t.classList.remove('fuse'); t.style.setProperty('--fuse',ms+'ms'); void t.offsetWidth;

  function roll(el){ if(el&&!rm.matches) re(el,'roll'); }

  function shake(el){ if(el&&!rm.matches) re(el,'shake'); }
  document.addEventListener('click',function(e){ var t=e.target; if(!t||!t.closest) return;
    if(t.closest('.btn.lg,.kmv,.np-key,.okbox,.nohay,.oitem-check,.ctab')&&window.haptic) try{ haptic('tap'); }catch(_){}

  return {fuse:fuse,roll:roll,num:num,shake:shake};
})();

   dentro de un gesto (gest) y la clase html.kd-live (transiciones CSS) nace en la primera interacción. Respeta Reducir

// Términos AMBIGUOS: existen en más de una carne. Si el cliente no especifica, se pregunta.
// has = palabras que disparan; q = calificadores que SÍ resuelven (entonces no es ambiguo); options = [etiqueta, nombre exacto].
const AMBIG=[
  {has:['asar'], q:['res','cerdo','puerco','pollo'], options:[['Res','Carne de asar'],['Cerdo','Cerdo para asar']]},
  {has:['molida'], q:['res','cerdo','puerco'], options:[['Res','Molida'],['Cerdo','Molida de cerdo']]},
  {has:['costilla'], q:['res','cerdo','puerco'], options:[['Res','Costilla de res'],['Cerdo','Costilla de cerdo']]},
  {has:['estofado'], q:['res','cerdo','puerco'], options:[['Res','Estofado'],['Cerdo','Estofado de cerdo']]},
  {has:['tajo'], q:['res','cerdo','puerco','negro'], options:[['Res','Tajo negro'],['Cerdo','Tajo de cerdo']]},
  {has:['lomo'], q:['res','cerdo','puerco','limpio'], options:[['Res','Lomo limpio'],['Cerdo','Lomo de cerdo']]},
  {has:['patas','pata'], q:['cerdo','puerco','pollo','res'], options:[['Cerdo','Patas de cerdo'],['Pollo','Patas de pollo']]},
];
const _norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function _ambig(rest){ const n=_norm(rest);
  return AMBIG.find(a=> a.has.some(h=>n.split(' ').includes(h)) && !a.q.some(qw=>n.includes(qw))) || null; }
function _extractQty(line){
  const m=line.match(/(\d+(?:[.,]\d+)?)/);
  const qty=m?parseFloat(m[1].replace(',','.')):1;
  const rest=line.replace(/\d+(?:[.,]\d+)?/g,' ')
    .replace(/\b(libras?|lbs?|lb|kilos?|kg|de|del|la|el|los|las|una?|unos?|unas?|porfa|porfis|por favor|ya|me das|dame|quiero|necesito|y|con|mi orden|orden|pedido)\b/gi,' ')
    .trim();
  return {qty:qty>0?qty:1, rest};
}
const _isEnabled=name=>{ const p=prodByName(name); return p && !p.disabled; };
function _matchProduct(rest){
  const n=_norm(rest); if(n.replace(/\s/g,'').length<2) return null;
  for(const [keys,prod] of ALIASES){ for(const k of keys){ if(n.includes(_norm(k))) return _isEnabled(prod)?prod:null; } } // agotado → no lo mapea
  // coincidencia difusa por tokens (ignora agotados)
  let best=null,bs=0;
  for(const p of PRODUCTS){ if(p.disabled) continue; const b=_norm(p.name); const A=n.split(' '),B=b.split(' ');
    let c=0; A.forEach(t=>{ if(t.length>2 && B.some(u=>u.includes(t)||t.includes(u))) c++; });
    const sc=c/Math.max(A.length,B.length); if(sc>bs){bs=sc;best=p.name;} }
  return bs>=0.5?best:null;
}
function parseOrderText(text){
  const lines=(text||'').split(/[\n\r]+/).map(l=>l.trim()).filter(Boolean);
  const items=[], unknown=[], ambiguous=[];
  for(const raw of lines){
    if(/^(hola|buenas|buenos|gracias|mi orden|orden seria|orden sería|pedido|por favor)\b/i.test(raw) && !/\d/.test(raw) && raw.split(' ').length<4) continue;
    const {qty,rest}=_extractQty(raw);
    const amb=_ambig(rest);
    if(amb){ ambiguous.push({line:raw, qty, options:amb.options}); continue; } // res o cerdo → preguntar
    const name=_matchProduct(rest);
    if(name){ const ex=items.find(x=>x.name===name); if(ex) ex.qty+=qty; else items.push({name,qty}); }
    else if(_norm(raw).replace(/\s/g,'').length>1) unknown.push(raw);
  }
  return {items, unknown, ambiguous};
}

function archiveStaleListas(){
  if(!state||!state.history) return;
  const today=dayStart(Date.now()); const keep=[]; let changed=false;
  const term=['lista','entregada','cancelada'];
  state.orders.forEach(o=>{
    const ref=o.listaAt||o.paidAt||o.createdAt;
    if(term.includes(o.status) && dayStart(ref)<today){ o.archived=true; o.archivedAt=Date.now(); state.history.push(o); changed=true; }
    else keep.push(o);
  });
  if(changed){ state.orders=keep; save(); }
}

function toRow(o){ return {id:o.id,folio:o.folio,client_name:o.clientName,phone:o.phone,zone:o.zone,addr:o.addr,delivery:o.delivery,shipping:o.shipping||0,note:o.note,status:o.status,paid:!!o.paid,paid_at:o.paidAt||null,lista_at:o.listaAt||null,archived:!!o.archived,archived_at:o.archivedAt||null,created_at:o.createdAt,held:!!o.held,items:o.items||[],hist:o.hist||[]}; }
function fromRow(r){ return {id:r.id,folio:r.folio,clientName:r.client_name,phone:r.phone,zone:r.zone,addr:r.addr,delivery:r.delivery,shipping:Number(r.shipping)||0,note:r.note,status:r.status,paid:!!r.paid,paidAt:r.paid_at,listaAt:r.lista_at,archived:!!r.archived,archivedAt:r.archived_at,createdAt:Number(r.created_at),held:!!r.held,items:r.items||[],hist:r.hist||[]}; }
async function dbFetch(){
  const {data,error}=await supa.from('orders').select('*');
  if(error){ console.warn('Supabase fetch:',error.message); return false; }
  const all=(data||[]).map(fromRow);
  // No pisar una comanda que ACABAMOS de cambiar localmente (aún no dio round-trip): si se guardó
  // hace <3.5s, conservamos la versión local → el refetch no revierte "pasar a pago", "pagado", etc.
  const now=Date.now();
  const cloudIds=new Set(all.map(o=>o.id));
  const localAll=[...(state.orders||[]),...(state.history||[])];
  const localById={}; localAll.forEach(o=>{ localById[o.id]=o; });
  let merged=all.map(o=>{ const t=_recentSave[o.id]; return (t && now-t<3500 && localById[o.id]) ? localById[o.id] : o; });
  localAll.forEach(o=>{ const t=_recentSave[o.id]; if(t && now-t<3500 && !cloudIds.has(o.id)) merged.push(o); }); // recién creadas
  state.orders=merged.filter(o=>!o.archived).sort((a,b)=>b.createdAt-a.createdAt);
  state.history=merged.filter(o=>o.archived);
  state.seq=Math.max(0, ...merged.map(o=>parseInt(o.folio,10)||0))+1;
  // clientes: la nube manda si la tabla existe y tiene datos; si no, respaldo local del dispositivo
  try{ const {data:cl,error:ce}=await supa.from('clients').select('*');
    if(!ce && cl && cl.length) state.clients=cl.map(fromRowC);
    else if(!state.clients || !state.clients.length) state.clients=loadClientsLocal();
  }catch(e){ if(!state.clients || !state.clients.length) state.clients=loadClientsLocal(); }
  // ¿Cuáles de estos clientes se hicieron cuenta en la tienda web? Las cuentas NO viven en
  // una tabla normal sino en `auth.users`, que el navegador no puede leer. Lo contesta la
  // función `cuentas_web()` (SQL_cuentas_web.sql): solo responde a admin/carnicero y solo
  // devuelve los últimos 8 dígitos del teléfono, el nombre con que se registró y las fechas.
  // Si la función todavía no existe, esto no rompe nada: nadie queda marcado y ya.
  try{ const {data:cw,error:we}=await supa.rpc('cuentas_web');
    if(!we && Array.isArray(cw)){ const m={}; cw.forEach(r=>{ if(r&&r.tel8) m[r.tel8]=r; }); state.webAcc=m; }
  }catch(e){ /* sin cuentas_web la app sigue igual que siempre */ }
  return true;
}
// Respaldo local de clientes: si la tabla `clients` no existe en la nube (SQL_clients.sql),

function loadClientsLocal(){ try{ return JSON.parse(localStorage.getItem('ct_v2_clients')||'[]'); }catch(e){ return []; } }

function fromRowC(r){ return {phone:r.phone, name:r.name, zone:r.zone, addr:r.addr, note:r.note, createdAt:Number(r.created_at)||0}; }
function upsertClient(c){
  if(!c||_digits(c.phone).length<4||!c.name) return;
  const np=_digits(c.phone); if(!state.clients) state.clients=[];
  const i=state.clients.findIndex(x=>_phoneKey(x.phone)===_phoneKey(np));
  // si ya existe, conservar el teléfono guardado (evita duplicar "98765432" vs "50498765432")
  const rec={phone:(i>=0?state.clients[i].phone:np), name:c.name, zone:c.zone||'', addr:c.addr||'', note:(i>=0?state.clients[i].note:'')||'', createdAt:(i>=0?state.clients[i].createdAt:Date.now())};
  if(i>=0) state.clients[i]=rec; else state.clients.push(rec);
  saveClientsLocal();
  if(USE_SUPA) supa.from('clients').upsert(toRowC(rec)).then(({error})=>{ if(error) console.warn('Supabase client upsert:',error.message); });
}

function dbDeleteOrder(id){ console.warn('v2: borrado de comandas deshabilitado (se archiva)'); }

    return new Promise(res=>setTimeout(()=>{ supa.from('orders').upsert(row).then(({error:e2})=>{ if(e2) syncFailed('upsert: '+e2.message); res(!e2); }); },1500));
  }); }

  _bell.src=await _toneUrl(bellTone); _bell.muted=false; try{_bell.volume=1;}catch(e){}
  const p=_bell.play(); if(p&&p.then) await p; return true;
}catch(e){ return false; } }
// Respaldo Web Audio (mismo timbre fuerte de campana) si el <audio> aún no está autorizado.
function _dingSynth(){ try{ unlockAudio(); const a=_actx; if(!a) return;
  const seq=[784,1047,1319,1047]; const out=_audioOut();
  const round=(base)=>seq.forEach((f,i)=>{ [[f,'triangle',0.9],[f*2,'sine',0.4]].forEach(([fr,ty,pk])=>{
    const o=a.createOscillator(),g=a.createGain(); o.type=ty; o.frequency.value=fr; o.connect(g); g.connect(out);
    const t=a.currentTime+base+i*0.16;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(pk,t+0.018); g.gain.exponentialRampToValueAtTime(0.0001,t+0.4);
    o.start(t); o.stop(t+0.42); }); });
  round(0); round(1.0); round(2.0);
}catch(e){} }
// force=true (botones de la hoja de sonido) salta el anti-doble; sin force, dos avisos con
// menos de 4 s entre sí se funden en uno (evita timbrazos encimados al entrar/sincronizar).
function playDing(force){ if(!soundOn) return;
  const now=Date.now(); if(!force && now-lastDingAt<4000) return; lastDingAt=now;
  if(navigator.vibrate) navigator.vibrate([300,120,300,120,300]);
  playBell().then(ok=>{ if(!ok) _dingSynth(); }).catch(()=>_dingSynth()); }

// Versión visible en Ajustes → sirve para confirmar que "Buscar actualización" trajo lo último.
// SUBIR esta fecha en cada deploy.

// Trae la última versión sin tener que desinstalar la PWA: borra los cachés del service worker
// y recarga. Como el HTML es network-first, la recarga baja el index.html más reciente.
async function forceUpdate(){
  toast('Buscando actualización…');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.update().catch(()=>{})));
    }
    if(window.caches){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
  }catch(_){}
  setTimeout(()=>location.reload(), 400);
}

// TIMBRE INSISTENTE: mientras haya comandas "Por cotizar" sin atender, re-suena cada 25 s
// (no interrumpe si están trabajando una comanda con la hoja abierta; se calla con la bocina).
// Hora de retiro parseada a un Date de HOY (para la alerta). "3:00 PM", "10:30 AM", "15:00"; sin hora → null.
function pickupDate(o){ const s=retiroHora(o); if(!s) return null;
  const m=/(\d{1,2}):(\d{2})\s*(a\.?\s?m\.?|p\.?\s?m\.?|am|pm)?/i.exec(s); if(!m) return null;
  let h=+m[1]; const min=+m[2], ap=(m[3]||'').replace(/[^apm]/gi,'').toLowerCase();
  if(ap.startsWith('p') && h<12) h+=12; if(ap.startsWith('a') && h===12) h=0;
  const d=new Date(); d.setHours(h,min,0,0); return d; }
// Alerta 20 min antes de la hora de retiro (para estar listos). Una vez por comanda.
let _pickupAlerted={};
function checkPickupAlerts(){
  const now=Date.now();
  state.orders.filter(o=>o.status==='preparacion' && o.held && isRetiro(o)).forEach(o=>{
    const t=pickupDate(o); if(!t) return; const diff=t.getTime()-now;
    if(diff>0 && diff<=20*60000 && !_pickupAlerted[o.id]){ _pickupAlerted[o.id]=true; playDing(true);
      const c=$("#colC3"); if(c){ c.classList.add('alerted'); setTimeout(()=>c.classList.remove('alerted'),1800); }
      toast('⏰ Retiro de '+o.clientName+' se acerca ('+retiroHora(o)+') — alistate'); } });
}

let selRole=null;
document.querySelectorAll(".role-btn").forEach(b=>b.onclick=()=>{
  selRole=b.dataset.role;
  document.querySelectorAll(".role-btn").forEach(x=>x.classList.toggle("sel",x===b));

  $("#loginErr").textContent=""; $("#loginGo").disabled=false;
});
$("#pinInput").addEventListener("input",()=>{ $("#loginErr").textContent=""; });
$("#pinInput").addEventListener("keydown",e=>{ if(e.key==="Enter") doLogin(); });
$("#loginGo").onclick=doLogin;
async function doLogin(){
  if(!selRole) return;
  const pw=$("#pinInput").value;
  if(!pw){ $("#loginErr").textContent="Escribe la contraseña."; $("#pinInput").focus(); return; }
  if(!USE_SUPA){ // sin nube → fallback local con PIN
    if(pw!==CREDS[selRole]){ $("#loginErr").textContent="Contraseña incorrecta."; $("#pinInput").value=""; return; }
    load(); await enterApp(selRole); return;
  }
  const go=$("#loginGo"); go.disabled=true; $("#loginErr").textContent="Entrando…";
  try{
    const {error}=await supa.auth.signInWithPassword({email:AUTH_EMAILS[selRole], password:pw});
    if(error){ const m=(error.message||'').toLowerCase();
      $("#loginErr").textContent = m.includes('confirm')?'La cuenta no está confirmada en Supabase (márcala como confirmada).'
        : m.includes('credential')?'Contraseña incorrecta (o el correo de la cuenta no coincide).'
        : ('No pude entrar: '+error.message);
      $("#pinInput").value=""; $("#pinInput").focus(); go.disabled=false; return; }
    await enterApp(selRole);
  }catch(e){ $("#loginErr").textContent="No pude entrar. Revisa la conexión."; go.disabled=false; }
}
async function enterApp(role){
  session.role=role; _carnSigLast=''; // forzar pintado completo al entrar
  document.documentElement.classList.toggle('rol-carn', role==='carnicero'); _seenReady=false; _seenCards.clear(); _prevBadge=null;
  // El carnicero lee a distancia: "Texto grande" arranca encendido la primera vez (después manda su elección).
  if(role==='carnicero' && localStorage.getItem('ct_v2_bigtext')==null){ bigText=true; localStorage.setItem('ct_v2_bigtext','on'); applyBigText(); }
  // Periodo de gracia del timbre: al entrar NO suena de una (el insistente esperaba con reloj
  // vencido y timbraba al instante — el "bug de la alarma al volver a entrar").
  lastDingAt=Date.now(); prevCotizar=null; prevPreparacion=null;
  if(USE_SUPA) await initSupaData(); else archiveStaleListas();
  unlockAudio(); // activar sonido dentro del gesto del login (necesario en iPad)
  $("#login").classList.add("hidden"); $("#app").classList.remove("hidden"); ctSessOff();
  $("#loginErr").textContent=""; $("#loginGo").disabled=false;
  startClock(); rerender();
  if(role==='carnicero'){
    keepAwake(); // pantalla siempre despierta en el puesto del carnicero
    refreshPushState().then(()=>{ if(session.role==='carnicero') renderCarnicero(); });
  } else {
    refreshPushState().then(()=>{ if(session.role==='admin') renderAdmin(); }); // estado del botón "Activar avisos" del admin
  }
}

let adminView="resumen"; // v2: el admin aterriza en Resumen (cobrar/entregar), no en Nueva comanda
let _prevBadge=null;
let clock=0, clockT;
function startClock(){ clockT=setInterval(()=>{ if(session.role==="carnicero") updateClock(); },1000); }
function updateClock(){ const el=$("#syncClock"); if(el) el.textContent="actualizado "+timeAgo(lastSync).replace("hace ","hace ").replace("instantes","ahora");
  const b=$("#syncBtn"); if(b) b.classList.toggle('stale', Date.now()-lastSync>120000); } // ámbar si lleva >2 min sin sincronizar
// Refresco automático cada 30s. NO hace logout; el logout es por inactividad (2h, abajo).
// No refresca al admin si está capturando una comanda o con una hoja/editor abierto (perdería lo escrito).
function safeToRefreshAdmin(){ if(adminView==='nueva') return false; if(document.querySelector('.overlay')) return false;
  // No re-dibujar mientras el admin ESCRIBE en cualquier campo (búsqueda de bandeja, dirección de
  // Envíos, catálogo…): un refresco automático a media escritura le saca el foco y le revierte el texto.
  const ae=document.activeElement;
  if(ae && (ae.tagName==='INPUT'||ae.tagName==='TEXTAREA') && !/^(checkbox|radio|button|submit)$/.test(ae.type||'')) return false;
  return true; }
setInterval(()=>{ archiveStaleListas();
  // Modo nube: bajar datos de verdad (red de seguridad si el realtime se cae). scheduleRefetch ya
  // respeta al admin cuando está capturando/editando y re-pinta al carnicero (suena si entró comanda).
  if(USE_SUPA && session.role){ scheduleRefetch(); return; }
  if(session.role==="carnicero"){ tapSafeRerender(); }
  else if(session.role==="admin" && safeToRefreshAdmin()){ tapSafeRerender(); }
},30000);
// Cierre de sesión SOLO por inactividad (mínimo 2 horas sin interacción).
let lastActivity=Date.now();
['click','keydown','touchstart','pointerdown'].forEach(ev=>window.addEventListener(ev,()=>{ lastActivity=Date.now(); unlockAudio(); unlockBell(); },{passive:true}));
// Al volver la app a primer plano (iPad dormido, cambio de app): re-activar audio + bajar datos
// frescos + re-tomar el wake lock (el sistema lo suelta al ocultar la página).
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ unlockAudio(); if(USE_SUPA && session.role) scheduleRefetch(); if(session.role==='carnicero') keepAwake(); } });
setInterval(()=>{ if(session.role && Date.now()-lastActivity>2*3600*1000){ logout(); } },60000);

function rerender(){
  if(!session.role) return;
  if(session.role==="admin") renderAdmin(); else renderCarnicero();
}
/* GUARDIÁN DE TAPS (iPad): los re-renders AUTOMÁTICOS (30s, realtime, sync) esperan a que el
   dedo se levante. Si el tablero se reconstruye a media pulsación, el botón tocado se destruye
   y el tap se pierde → "lag" / tocar dos veces. Las acciones del usuario re-pintan directo. */
let _touching=false,_lastTouchEnd=0,_pendRerender=null;
window.addEventListener('touchstart',()=>{_touching=true;},{passive:true});
window.addEventListener('touchend',()=>{_touching=false;_lastTouchEnd=Date.now();},{passive:true});
window.addEventListener('touchcancel',()=>{_touching=false;_lastTouchEnd=Date.now();},{passive:true});
function tapSafeRerender(){
  if(_touching || Date.now()-_lastTouchEnd<350){ clearTimeout(_pendRerender); _pendRerender=setTimeout(tapSafeRerender,250); return; }
  rerender();
}

/* Buscador de la bandeja: filtra por nombre, folio o teléfono (con 40 comandas, escanear columnas es lento). */
let bandejaQ='';
function bandejaMatch(o){
  const q=_norm(bandejaQ); if(!q) return true;
  if(_norm(o.clientName).includes(q)) return true;
  const qd=q.replace(/[^0-9]/g,'');
  return qd.length>=2 && (String(o.folio).includes(qd) || _digits(o.phone).includes(qd));
}
function abColsHtml(){
  return A_COLS.map(([cls,label,st])=>{
    const arr=state.orders.filter(o=>o.status===st && bandejaMatch(o));
    return `<div class="kcol ${cls}">
      <div class="kcol-head"><span class="kn">${label}</span><span class="kc">${arr.length}</span></div>
      <div class="kcol-body">
        ${st==='cotizar'?Kd.qoHtml(!arr.length&&!bandejaQ):''}${arr.map(o=>akcard(o,st)).join("")}${arr.length?'':(bandejaQ?`<div class="kempty"><div class="ke-ic">${ic('search',22)}</div>Sin coincidencias</div>`:(st==='cotizar'?'':Kd.vacio(st,A_EMPTY[st])))}

}

// El ADMIN puede mover cualquier comanda entre estaciones con las flechas ‹ › (control total).
// Mover con flecha NO marca pagado — eso sigue siendo el botón "Marcar pagado".
const A_ORDER=['cotizar','espera_pago','preparacion','lista','en_ruta','entregada'];
function adminMove(id,dir){
  const o=orderById(id); if(!o) return;
  const i=A_ORDER.indexOf(o.status); if(i<0) return;
  const ni=i+dir; if(ni<0||ni>=A_ORDER.length) return;
  // v2: de "Por cobrar" a "En preparación" sin marcar pagado → preguntar antes (el carnicero empezaría a cortar sin cobro).
  if(o.status==='espera_pago' && A_ORDER[ni]==='preparacion' && !o.paid && !o.held){ askCobrado(id); return; }
  setStatus(o,A_ORDER[ni]);
  if(A_ORDER[ni]==='lista' && !o.listaAt) o.listaAt=Date.now();
  save(o); rerender();
  toast('#'+o.folio+' → '+STATUS[A_ORDER[ni]], ()=>revertStatus(id));
}
function askCobrado(id){ const o=orderById(id); if(!o) return;
  $("#overlayHost").innerHTML=`<div class="overlay"><div class="confirm-box">
    <div class="cb-ic">${ic('cash',38)}</div><div class="cb-t">¿Ya cobraste?</div>
    <div class="cb-s">#${o.folio} · ${esc(o.clientName)} · <b>${money(fullTotal(o))}</b>${isRetiro(o)?'<br>Si paga al retirar, usá «Poner en espera de retiro» desde la comanda.':''}</div>
    <div class="cb-row"><button class="btn ghost block" onclick="closeSheet()">Todavía no</button>
      <button class="btn red block" onclick="markPaid('${o.id}')">Sí, ya cobré</button></div>
  </div></div>`;
}
function faltoBanner(o){ const f=(o.items||[]).filter(it=>!it.available); if(!f.length) return '';
  return `<div class="kfalto">${ic('x',14)} <span><b>No hay:</b> ${f.map(it=>esc(it.name)).join(' · ')}</span></div>`; }
function akcard(o,st){
  let footer='', tag='';
  if(st==='espera_pago') footer=`<button class="kmv go" onclick="event.stopPropagation();markPaid('${o.id}')">${ic('cash',16)} Marcar pagado</button>`;
  else if(st==='lista') footer=`<button class="kmv fwd" onclick="event.stopPropagation();sendRepartidor('${o.id}')">${ic('truck',16)} Ficha repartidor</button>`;
  else if(st==='en_ruta') footer=`<button class="kmv go" onclick="event.stopPropagation();markDelivered('${o.id}')">${ic('check',16)} Marcar entregada</button>`;
  if(st==='cotizar') tag=`<div class="kwait">${ic('clock',14)} El carnicero está cotizando</div>`;
  else if(st==='preparacion') tag=`<div class="kpaid">${ic('knife',14)} En preparación</div>`;
  const idx=A_ORDER.indexOf(st);
  const arrow=(d,en)=> en
    ? `<button class="kmv anav" onclick="event.stopPropagation();adminMove('${o.id}',${d})" aria-label="${d<0?'Regresar':'Avanzar'} de estación">${ic(d<0?'left':'right',16)}</button>`
    : `<span class="kmv anav ghost"></span>`;
  const carnLive=_othersOnOrder(o.id).includes('carnicero'); // ¿un carnicero la tiene abierta ahora?
  return `<div class="kcard2 ${carnLive?'islive':''}" data-oid="${o.id}" onclick="openAdminOrder('${o.id}')">
    <div class="kf"><span class="kfolio">#${o.folio}</span><span class="ktime">${timeAgo(o.createdAt)}</span></div>
    <div class="kname">${dispName(o.clientName)}</div>

    ${carnLive?`<div class="klive"><span class="live-dot"></span> Un carnicero la está viendo ahora</div>`:''}
    ${o.note?`<div class="knote">${ic('note',14)} ${esc(o.note)}</div>`:""}
    ${faltoBanner(o)}
    ${cardItemsHtml(o)}
    ${cardTotalHtml(o)}
    <div style="margin-top:8px">${cardPayChip(o)}${o.paid?` <span class="kpaychip" style="background:#e6efe9;color:#1f7a48">${ic('check',12)} Pagado</span>`:""}</div>
    ${tag}
    <div class="kmove">${arrow(-1,idx>0)}${footer||`<span style="flex:1"></span>`}${arrow(1,idx<A_ORDER.length-1)}</div>
  </div>`;
}

// Resuelve una línea ambigua (res/cerdo/pollo): agrega el producto exacto al pedido y lo saca de "por confirmar".
function resolveAmbiguous(ambIdx, optIdx){
  const lp=draft.lastParse; if(!lp||!lp.ambiguous) return;
  const a=lp.ambiguous[ambIdx]; if(!a) return;
  const name=a.options[optIdx] && a.options[optIdx][1]; const p=prodByName(name); if(!p){ toast('Producto no encontrado'); return; }
  const ex=draft.items.find(x=>x.prodId===p.id); if(ex) ex.qty+=a.qty; else draft.items.push({prodId:p.id, qty:a.qty});
  lp.items=lp.items||[]; lp.items.push({name:p.name, qty:a.qty});
  lp.ambiguous.splice(ambIdx,1);
  initNueva();
  const cart=$("#cart"); if(cart) cart.scrollIntoView({block:'center',behavior:'smooth'});
  toast(p.name+' × '+a.qty+' agregado');
}

function draftTotal(){ return draft.items.reduce((s,it)=>{const p=prodById(it.prodId);return s+(p.price?it.qty*p.price:0);},0); }
function syncDraft(){
  const g=(id)=>{const e=$("#"+id);return e?e.value:"";};
  draft.clientName=g("dName")||draft.clientName; draft.phone=g("dPhone")||draft.phone;
  draft.zone=g("dZone")||draft.zone; draft.addr=g("dAddr")||draft.addr; draft.note=g("dNote")||draft.note;
  const sh=$("#dShip"); if(sh) draft.shipping=parseFloat(sh.value)||0;
}
// ---- Autocompletar cliente por NOMBRE al escribir en "Cliente" ----
// Evita ir a WhatsApp a copiar el nombre: se escribe, se elige de la lista y llena
// teléfono, zona y dirección del cliente ya guardado.
let _cliSug=[];
function cliSugRender(q){
  const box=$("#cliSug"); if(!box) return;
  const nq=_norm(q||'');
  if(nq.length<1){ box.hidden=true; box.innerHTML=''; _cliSug=[]; return; }
  const seen={}, out=[];
  (state.clients||[]).forEach(c=>{ if(!c||!c.name||isPhoneName(c.name)) return;
    if(_norm(c.name).indexOf(nq)<0) return;
    const k=_phoneKey(c.phone)||_norm(c.name); if(seen[k]) return; seen[k]=1; out.push(c); });
  out.sort((a,b)=> _norm(a.name).indexOf(nq)-_norm(b.name).indexOf(nq) || a.name.localeCompare(b.name));
  _cliSug=out.slice(0,6);
  if(!_cliSug.length){ box.hidden=true; box.innerHTML=''; return; }
  box.innerHTML=_cliSug.map((c,i)=>`<button type="button" data-i="${i}"><span class="cs-ic">${ic('user',16)}</span><span class="cs-t"><span class="cs-nm">${esc(c.name)}</span><span class="cs-sub">${esc(c.phone||'sin teléfono')}${c.zone?' · '+esc(c.zone):''}</span></span></button>`).join('');
  box.hidden=false;
  box.querySelectorAll('button').forEach(b=>b.addEventListener('mousedown',e=>{ e.preventDefault(); cliSugPick(+b.dataset.i); }));
}
function cliSugPick(i){
  const c=_cliSug[i]; if(!c) return;
  syncDraft();

const _digits=p=>(p||'').replace(/\D/g,'');
// Números de Honduras = 8 dígitos; compara los últimos 8 para que "9876-5432" encuentre a "+504 9876-5432".
const _phoneKey=p=>{ const d=_digits(p); return d.length>8?d.slice(-8):d; };
// Cuenta de la tienda web para este teléfono, o null. Se empareja por los últimos 8 dígitos
// porque la comanda guarda 99998888 y Supabase Auth guarda +50499998888.
const cuentaWeb=p=>{ const k=_phoneKey(p); return (k.length===8 && state.webAcc) ? (state.webAcc[k]||null) : null; };
const fechaCorta=t=>{ try{ return new Date(t).toLocaleDateString('es-HN',{day:'numeric',month:'short',year:'numeric'}); }catch(e){ return ''; } };
function clientByPhone(phone){
  const np=_phoneKey(phone); if(np.length<4) return null;
  if(state.clients){ const c=state.clients.find(x=>_phoneKey(x.phone)===np); if(c) return c; }
  const o=allOrders().find(x=>_phoneKey(x.phone)===np);
  return o? {phone:o.phone,name:o.clientName,zone:o.zone,addr:o.addr} : null;
}
/* ----- CLIENTES WEB SIN NOMBRE -----
   Un pedido de la tienda web llega a veces solo con el teléfono: clientName = "31738030".
   isPhoneName() lo detecta; el admin le pone nombre de un toque (nameWebPrompt/nameWebSave). */
function isPhoneName(s){ const t=(s||'').trim(); if(!t) return false;
  if(/[a-zA-ZÀ-ÿ]/.test(t)) return false;      // tiene letras → es un nombre real
  return _digits(t).length>=6; }               // solo dígitos/símbolos y ≥6 dígitos → es un teléfono
// Nombre a mostrar: si es un teléfono sin nombre, añade una etiqueta ámbar.

// IA (Claude/OpenAI vía Edge Function). Timeout 7s. Si falla → throw y caemos al parser local.
async function aiParse(text){
  const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(),7000);
  try{
    const r=await fetch(SUPA_URL+'/functions/v1/parse-order',{
      method:'POST',
      headers: await fnHeaders(),
      body:JSON.stringify({text, catalog:PRODUCTS.filter(p=>!p.disabled).map(p=>p.canon||p.name)}),
      signal:ctrl.signal
    });
    clearTimeout(to);
    if(!r.ok) throw new Error('http '+r.status);
    const d=await r.json();
    if(d.error) throw new Error(d.error);
    const items=(d.items||[]).filter(it=>prodByName(it.name)); // solo nombres válidos del catálogo
    if(!items.length && (d.items||[]).length) throw new Error('sin coincidencias'); // respuesta inútil → fallback
    const ambiguous=(d.ambiguous||[]).filter(a=>Array.isArray(a.options)&&a.options.length);
    return {items, unknown:d.unknown||[], ambiguous};
  }catch(e){ clearTimeout(to); throw e; }
}
async function autollenarPedido(btn){
  const text=($("#dPaste")||{}).value||'';
  const phone=(($("#dPastePhone")||{}).value||'').trim();
  draft.pasteText=text; draft.pastePhone=phone; // preservar lo pegado (no se borra al re-renderizar)
  if(!text.trim() && !phone){ toast("Pega el pedido o el teléfono primero"); return; }
  let items=[], unknown=[], ambiguous=[], usedAI=false;
  if(text.trim()){
    const old=btn?btn.innerHTML:''; if(btn){ btn.disabled=true; btn.innerHTML=ic('clock',17)+' Leyendo…'; }
    // Las líneas AMBIGUAS (res/cerdo/pollo) se detectan local (determinista) y NO se mandan a la IA → SIEMPRE se confirman (la IA tiende a adivinar res).
    const lines=text.split(/[\n\r]+/).map(l=>l.trim()).filter(Boolean);
    const ambLocal=[], clearLines=[];
    for(const raw of lines){ const {qty,rest}=_extractQty(raw); const a=_ambig(rest); if(a) ambLocal.push({line:raw,qty,options:a.options}); else clearLines.push(raw); }
    const clearText=clearLines.join('\n');
    try{ const r = clearText.trim()? await aiParse(clearText) : {items:[],unknown:[],ambiguous:[]};
      items=r.items; unknown=r.unknown; ambiguous=(r.ambiguous||[]).concat(ambLocal); usedAI=true; }
    catch(e){ const r=parseOrderText(text); items=r.items; unknown=r.unknown; ambiguous=r.ambiguous||[]; } // fallback local (todo)
    if(btn){ btn.disabled=false; btn.innerHTML=old; }
    draft.lastParse={items, unknown, ambiguous, ai:usedAI}; // alimenta el panel de validación
  }
  // fusionar con lo que ya estaba (no pisar productos agregados a mano): los del texto se vuelven la base
  if(items.length){ draft.items=items.map(it=>{const p=prodByName(it.name); return p?{prodId:p.id,qty:it.qty}:null;}).filter(Boolean); }
  let foundClient=false;
  if(phone){ draft.phone=phone; const c=clientByPhone(phone); if(c){ draft.clientName=c.name||draft.clientName; draft.zone=c.zone||draft.zone; draft.addr=c.addr||draft.addr; foundClient=true; } }
  initNueva(); shipAutoQueue(); // la dirección del cliente ya conocida también dispara el cálculo del envío
  const cart=$("#cart"); if(cart) cart.scrollIntoView({block:'center',behavior:'smooth'});
  let msg=items.length? (items.length+" productos cargados"+(usedAI?" (IA)":"")) : "No reconocí productos";
  if(ambiguous.length) msg+=" · "+ambiguous.length+" por confirmar (res/cerdo)";
  if(unknown.length) msg+=" · "+unknown.length+" por revisar";
  if(foundClient) msg+=" · cliente identificado";
  else if(phone) msg+=" · cliente nuevo";
  toast(msg);
}

// Encoge la imagen antes de mandarla (menos tokens/datos). Devuelve dataURL jpeg.
function _resizeImage(file, maxSide, quality){
  return new Promise((res,rej)=>{ const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{ try{ URL.revokeObjectURL(url); let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
      const s=Math.min(1, maxSide/Math.max(w,h)); w=Math.max(1,Math.round(w*s)); h=Math.max(1,Math.round(h*s));
      const c=document.createElement('canvas'); c.width=w; c.height=h; const ctx=c.getContext('2d'); ctx.drawImage(img,0,0,w,h);
      res(c.toDataURL('image/jpeg', quality||0.72)); }catch(e){ rej(e); } };
    img.onerror=()=>rej(new Error('img')); img.src=url; });
}
