/* ================= ENVÍOS · calculadora de costo por distancia =================
   Misma cuenta que la tienda en línea (index.html · updateShip):
       costo = max(base, redondeoA5(base + L_por_km × km))   con km en LÍNEA RECTA desde el local.
   Los montos y el punto 0 los edita el panel de la tienda y viajan en
   app_config.store_catalog → meta.shipping / meta.origin. Acá SOLO se leen (nunca se escribe esa fila).
   Si la nube no responde, quedan los valores de respaldo de abajo y la calculadora sigue sirviendo. */
let SHIP_CFG={base:50, per_km:9, max_km:25, street_factor:1.3, origin:{lat:14.1091381,lng:-87.1916749},
              label:'Carnicería El Torito · Mercado San Pablo, El Manchén'};
// La distancia real por CALLE es mayor que la línea recta; se estima multiplicando por este factor.
function shipApplyMeta(m){
  if(!m) return;
  if(m.shipping){ if(m.shipping.base!=null) SHIP_CFG.base=+m.shipping.base||SHIP_CFG.base;
                  if(m.shipping.per_km!=null) SHIP_CFG.per_km=+m.shipping.per_km||SHIP_CFG.per_km;
                  if(m.shipping.street_factor!=null) SHIP_CFG.street_factor=+m.shipping.street_factor||SHIP_CFG.street_factor; }
  if(m.origin&&m.origin.lat&&m.origin.lng){ SHIP_CFG.origin={lat:+m.origin.lat,lng:+m.origin.lng};
                                            if(m.origin.label) SHIP_CFG.label=m.origin.label; }
}
const shipKm=p=>{const R=6371,a=SHIP_CFG.origin,dLat=(p.lat-a.lat)*Math.PI/180,dLng=(p.lng-a.lng)*Math.PI/180,
  la1=a.lat*Math.PI/180,la2=p.lat*Math.PI/180,
  x=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));};
const shipCost=km=>Math.max(SHIP_CFG.base, Math.round((SHIP_CFG.base+SHIP_CFG.per_km*km)/5)*5);
// Distancia por CALLE estimada = línea recta × factor. Es el RESPALDO: se cobra sobre la
// RUTA real (OSRM) cuando se puede medir; el factor fijo se queda corto en Tegucigalpa.
const shipKmStreet=p=>shipKm(p)*(SHIP_CFG.street_factor||1.3);
const _shipRoute={}; // "lat,lng" -> km (number) o null (OSRM falló); undefined = no consultado aún
const _shipKey=p=>p.lat.toFixed(5)+','+p.lng.toFixed(5);
// Distancia REAL por ruta (OSRM, gratis), cacheada por punto. Promise<number|null>.
function shipRouteKm(pin){
  const k=_shipKey(pin);
  if(_shipRoute[k]!==undefined) return Promise.resolve(_shipRoute[k]);
  try{
    const ctrl=new AbortController(), tm=setTimeout(()=>ctrl.abort(),6000), o=SHIP_CFG.origin;
    const u='https://router.project-osrm.org/route/v1/driving/'+o.lng+','+o.lat+';'+pin.lng+','+pin.lat+'?overview=false';
    return fetch(u,{signal:ctrl.signal}).then(r=>{clearTimeout(tm);return r.ok?r.json():null;})
      .then(j=>{const m=j&&j.routes&&j.routes[0]&&j.routes[0].distance; const km=(typeof m==='number'&&isFinite(m)&&m>0)?m/1000:null; _shipRoute[k]=km; return km;})
      .catch(()=>{ _shipRoute[k]=null; return null; });
  }catch(e){ _shipRoute[k]=null; return Promise.resolve(null); }
}
// km que se COBRA: la ruta real si ya la medimos, si no el estimado ×factor.
function shipChargedKm(pin){ const r=_shipRoute[_shipKey(pin)];
  return (typeof r==='number') ? {km:r,source:'ruta'} : {km:shipKm(pin)*(SHIP_CFG.street_factor||1.3),source:'estimado'}; }

/* Coordenadas dentro de un texto: link de Google Maps (?q= · @ · !3d!4d) o "14.09,-87.19" pegado a mano.
   Los pedidos de la web ya traen "📍 Ubicación: https://maps.google.com/?q=lat,lng" dentro de la dirección. */
function shipParseGeo(t){
  if(!t) return null; const s=String(t);
  const m=s.match(/[?&](?:q|ll|sll|daddr|destination|query|center)=(?:loc:)?(-?\d{1,2}\.\d+)(?:,|%2C)\s*(-?\d{1,3}\.\d+)/i)
       || s.match(/@(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)/)
       || s.match(/!3d(-?\d{1,2}\.\d+)!4d(-?\d{1,3}\.\d+)/)
       || s.match(/(?:^|[\s(])(-?\d{1,2}\.\d{3,}),\s*(-?\d{1,3}\.\d{3,})(?:[\s)]|$)/)
       // último recurso: cualquier par lat,lng con 4+ decimales suelto en el texto (apps con formatos raros)
       || s.match(/(-?\d{1,2}\.\d{4,}),\s*(-?\d{1,3}\.\d{4,})/);
  if(!m) return null;
  const lat=parseFloat(m[1]), lng=parseFloat(m[2]);
  if(!isFinite(lat)||!isFinite(lng)||Math.abs(lat)>90||Math.abs(lng)>180) return null;
  return {lat,lng};
}
// Los links cortos (maps.app.goo.gl) no dicen coordenadas y el navegador no puede seguirlos: hay que abrirlos.
const shipIsShortLink=t=>/(maps\.app\.goo\.gl|goo\.gl\/maps)/i.test(t||'');

/* Buscador de direcciones: Photon (OpenStreetMap) — gratis, sin llave.
   El bbox acota a Tegucigalpa: sin él salen resultados de otros países. */
function shipGeocode(q){
  return fetch('https://photon.komoot.io/api/?limit=6&lang=default&bbox=-87.50,13.80,-86.90,14.40&lat='
      +SHIP_CFG.origin.lat+'&lon='+SHIP_CFG.origin.lng+'&q='+encodeURIComponent(q))
    .then(r=>r.json()).then(j=>(j&&j.features)||[]);
}
function shipLabel(f){
  const p=f.properties||{};
  const main=p.name||[p.street,p.housenumber].filter(Boolean).join(' ')||p.city||p.district||p.locality||'Ubicación';
  const parts=[]; [p.district,p.suburb,p.locality,p.city].forEach(v=>{ if(v&&v!==main&&!parts.includes(v)) parts.push(v); });
  return {main, sub:parts.slice(0,2).join(', ')};
}
const shipFeatPin=f=>({lat:f.geometry.coordinates[1], lng:f.geometry.coordinates[0]});
const shipFeatName=f=>{const l=shipLabel(f); return l.main+(l.sub?' · '+l.sub:'');};

/* El mapa (Leaflet + OpenStreetMap) se baja SOLO al abrir la calculadora: la app no carga más peso al arrancar. */
let _leafletP=null;
function ensureLeaflet(){
  if(window.L) return Promise.resolve(window.L);
  if(_leafletP) return _leafletP;
  _leafletP=new Promise((res,rej)=>{
    const css=document.createElement('link');
    css.rel='stylesheet'; css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    css.integrity='sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY='; css.crossOrigin='';
    document.head.appendChild(css);
    const s=document.createElement('script');
    s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    s.integrity='sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo='; s.crossOrigin='';
    s.onload=()=>res(window.L); s.onerror=()=>{_leafletP=null; rej(new Error('mapa'));};
    document.head.appendChild(s);
  });
  return _leafletP;
}

let shipPin=null, shipPlace='', _shipMap=null, _shipMark=null, _shipLine=null;
let _shipSug=[], _shipSugI=-1, _shipT=null, _shipSeq=0, _shipSheet=false;

function shipCalcHtml(sheet){

function shipMountMap(){
  if(_shipMap){ try{_shipMap.remove();}catch(e){} _shipMap=null; _shipMark=null; _shipLine=null; }
  shipRender();
  // OJO: en esta app `L` ya es un helper del catálogo (const L=n=>({unit:'Libra'…})) — Leaflet SIEMPRE se usa como LF/window.L
  ensureLeaflet().then(LF=>{
    const el=document.getElementById('shipMapEl'); if(!el) return;
    const start=shipPin||SHIP_CFG.origin;
    _shipMap=LF.map(el,{zoomControl:true}).setView([start.lat,start.lng], shipPin?16:14);
    LF.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(_shipMap);
    LF.circleMarker([SHIP_CFG.origin.lat,SHIP_CFG.origin.lng],
      {radius:7,color:'#9F2629',weight:2,fillColor:'#9F2629',fillOpacity:.85}).addTo(_shipMap).bindTooltip('El local');
    _shipMark=LF.marker([start.lat,start.lng],{draggable:true,autoPan:true}).addTo(_shipMap);
    _shipMark.on('drag',e=>shipSetPin(e.target.getLatLng(),''));
    _shipMap.on('click',e=>{ _shipMark.setLatLng(e.latlng); shipSetPin(e.latlng,''); shipHideSug(); });
    // el contenedor puede medirse antes de estar pintado: sin esto quedan tiles en blanco
    setTimeout(()=>{ if(_shipMap) _shipMap.invalidateSize(); },160);
    if(shipPin) shipSetPin(shipPin,null); else shipRender();
  }).catch(()=>{
    const el=document.getElementById('shipMapEl');
    if(el) el.innerHTML='<div class="kempty" style="margin:0;padding:22px 14px">Sin internet para el mapa · podés escribir la colonia igual</div>';
  });
}
function shipSetPin(ll,place){
  shipPin={lat:ll.lat,lng:ll.lng}; if(place!=null) shipPlace=place;
  if(_shipMap&&window.L){
    if(_shipLine){ _shipMap.removeLayer(_shipLine); }
    _shipLine=window.L.polyline([[SHIP_CFG.origin.lat,SHIP_CFG.origin.lng],[shipPin.lat,shipPin.lng]],
      {color:'#9F2629',weight:2,opacity:.65,dashArray:'6 6'}).addTo(_shipMap);
  }
  shipRender();
}
function shipRender(){
  const rd=$("#shipRead"), ct=$("#shipCuenta"), lk=$("#shipMapsLink");
  if(!rd) return;
  if(!shipPin){
    rd.className='ship-read';
    rd.innerHTML='<div><span class="rl">Distancia</span><span class="rn">Buscá la dirección o movés el pin</span></div><span class="rc">—</span>';
    if(ct) ct.innerHTML=''; if(lk) lk.style.display='none';
    return;
  }
  const km=shipKm(shipPin), here=km<0.05;
  if(lk){ lk.style.display=''; lk.href='https://maps.google.com/?q='+shipPin.lat.toFixed(6)+','+shipPin.lng.toFixed(6); }
  if(km>SHIP_CFG.max_km){
    rd.className='ship-read out';
    rd.innerHTML=`<div><span class="rl">${km.toFixed(1)} km en línea recta</span><span class="rn">Fuera de zona · más de ${SHIP_CFG.max_km} km</span></div><span class="rc">—</span>`;
    if(ct) ct.innerHTML='La tienda no acepta pedidos a domicilio a esta distancia. Si lo vas a llevar igual, el precio se acuerda a mano.';
    return;
  }
  const _k=_shipKey(shipPin), _routed=_shipRoute[_k];
  const ruta=(typeof _routed==='number'), measuring=(_routed===undefined);
  const kmCalle = ruta ? _routed : km*(SHIP_CFG.street_factor||1.3); // se cobra sobre la ruta real (o el estimado)
  const c=shipCost(kmCalle);
  rd.className='ship-read';
  rd.innerHTML=`<div><span class="rl">${here?'En el local':'~'+kmCalle.toFixed(1)+' km '+(ruta?'por ruta':'por calle')}</span>
      <span class="rn">${esc(shipPlace||'Punto en el mapa')}</span></div><span class="rc">${money(c)}</span>`;
  if(ct) ct.innerHTML=here?'' :`Cuenta: ${money(SHIP_CFG.base)} + ${money(SHIP_CFG.per_km)} × ${kmCalle.toFixed(1)} km = ${money(Math.round(SHIP_CFG.base+SHIP_CFG.per_km*kmCalle))} → redondeado <b>${money(c)}</b>.<br><span style="color:var(--muted-2)">${ruta?'Distancia real por carretera (OSRM).':(measuring?'Estimado; midiendo la ruta real…':'Estimado (no se pudo medir la ruta; ajústalo si hace falta).')}</span>`;
  if(measuring){ const _p=shipPin; shipRouteKm(_p).then(()=>{ if(shipPin&&_shipKey(shipPin)===_shipKey(_p)) shipRender(); }); }
}
function shipReset(){
  shipPin=null; shipPlace='';
  const q=$("#shipQ"); if(q) q.value='';
  if(_shipMap){ if(_shipLine){_shipMap.removeLayer(_shipLine);_shipLine=null;}
    _shipMap.setView([SHIP_CFG.origin.lat,SHIP_CFG.origin.lng],14);
    if(_shipMark) _shipMark.setLatLng([SHIP_CFG.origin.lat,SHIP_CFG.origin.lng]); }

function shipCopy(){
  if(!shipPin){ toast('Primero ubicá el punto'); return; }

}
/* --- buscador con sugerencias --- */
function shipHideSug(){ const s=$("#shipSug"); if(s){ s.hidden=true; s.innerHTML=''; } _shipSug=[]; _shipSugI=-1; }
function shipPaintSug(feats){
  const s=$("#shipSug"); if(!s) return; _shipSug=feats; _shipSugI=-1;
  if(!feats.length){ s.innerHTML='<div class="empty">Sin resultados · movés el pin a mano</div>'; s.hidden=false; return; }
  s.innerHTML=feats.map((f,i)=>{const l=shipLabel(f);
    return `<button type="button" onclick="shipPickSug(${i})">${esc(l.main)}${l.sub?`<span class="s2">${esc(l.sub)}</span>`:''}</button>`;}).join('');
  s.hidden=false;
}
function shipPickSug(i){
  const f=_shipSug[i]; if(!f||!f.geometry) return;
  const pin=shipFeatPin(f), name=shipFeatName(f);
  const q=$("#shipQ"); if(q) q.value=name;
  if(_shipMap&&_shipMark){ _shipMap.setView([pin.lat,pin.lng],16); _shipMark.setLatLng([pin.lat,pin.lng]); }
  shipSetPin(pin,name); shipHideSug();
}
function shipSearchGo(){
  const el=$("#shipQ"), q=el?(el.value||'').trim():''; if(!q) return;
  const geo=shipParseGeo(q);
  if(geo){ shipJumpTo(geo,'Ubicación compartida'); shipHideSug(); return; }
  if(shipIsShortLink(q)){ toast('Ese link corto no trae coordenadas: abrilo y copiá el punto'); return; }
  if(_shipSugI>=0&&_shipSug[_shipSugI]){ shipPickSug(_shipSugI); return; }
  if(_shipSug.length){ shipPickSug(0); return; }
  shipGeocode(q).then(fs=>{ if(fs.length){ _shipSug=fs; shipPickSug(0); } else toast('No encontré esa dirección · movés el pin'); })
    .catch(()=>toast('Sin internet para buscar · movés el pin'));
}
function shipJumpTo(pin,name){
  if(_shipMap&&_shipMark){ _shipMap.setView([pin.lat,pin.lng],16); _shipMark.setLatLng([pin.lat,pin.lng]); }
  shipSetPin(pin,name);
}
function shipWireSearch(){
  const q=$("#shipQ"); if(!q) return;
  q.oninput=()=>{
    const v=(q.value||'').trim();
    clearTimeout(_shipT);
    if(shipParseGeo(v)){ shipHideSug(); shipSearchGo(); return; }
    if(v.length<3){ shipHideSug(); return; }
    _shipT=setTimeout(()=>{ const my=++_shipSeq;
      shipGeocode(v).then(fs=>{ if(my===_shipSeq) shipPaintSug(fs); }).catch(()=>{}); },350);
  };
  q.onkeydown=e=>{
    const open=_shipSug.length && !($("#shipSug")||{}).hidden;
    if(e.key==='ArrowDown'&&open){ e.preventDefault(); _shipSugI=Math.min(_shipSug.length-1,_shipSugI+1); shipMarkSug(); }
    else if(e.key==='ArrowUp'&&open){ e.preventDefault(); _shipSugI=Math.max(0,_shipSugI-1); shipMarkSug(); }
    else if(e.key==='Enter'){ e.preventDefault(); shipSearchGo(); }
    else if(e.key==='Escape'){ shipHideSug(); }
  };
  q.onblur=()=>setTimeout(shipHideSug,180);
}
function shipMarkSug(){ const bs=($("#shipSug")||document.createElement('div')).querySelectorAll('button');
  bs.forEach((b,i)=>b.classList.toggle('on',i===_shipSugI)); }

/* --- Autollenado del envío en la comanda nueva --- */
let _shipAutoT=null, _shipAutoLast='';
function shipAutoQueue(){
  if(draft.delivery!=='envio') return;
  clearTimeout(_shipAutoT); _shipAutoT=setTimeout(shipAutoRun,700);
}
async function shipAutoRun(){
  if(draft.delivery!=='envio') return;
  const addr=(draft.addr||'').trim(), zone=(draft.zone||'').trim();
  const geo=shipParseGeo(addr)||shipParseGeo(zone);
  if(!geo && (shipIsShortLink(addr)||shipIsShortLink(zone))){
    // maps.app.goo.gl no dice dónde queda y el navegador no puede seguirlo: hay que abrirlo.
    draft.shipCalc={err:'Ese link corto no dice dónde queda · abrilo en Maps y copiá el punto'}; shipHintPaint(); return;
  }
  const key=geo?('@'+geo.lat.toFixed(5)+','+geo.lng.toFixed(5)):(zone||addr);
  if(!geo && key.length<4) return;
  if(key===_shipAutoLast) return;
  _shipAutoLast=key;
  try{
    let pin=geo, place=geo?'Ubicación compartida':'';
    if(!pin){
      const fs=await shipGeocode(key);
      if(!fs.length){ draft.shipCalc={err:'No encontré esa dirección · ponelo a mano'}; shipHintPaint(); return; }
      pin=shipFeatPin(fs[0]); place=shipFeatName(fs[0]);
    }
    const kmLine=shipKm(pin), out=kmLine>SHIP_CFG.max_km, cg=shipChargedKm(pin), kmCalle=cg.km;
    draft.shipCalc={km:kmCalle,cost:out?0:shipCost(kmCalle),place,out,pin,source:cg.source}; // se cobra por ruta real (o estimado)
    // No pisa lo que el admin haya escrito a mano: solo autollena mientras el costo siga siendo automático.
    if(!out && draft.shipAuto!==false) shipApplySuggested(true);
    shipHintPaint();
    // Si el costo salió del estimado, medí la ruta real y refiná (sin pisar edición manual).
    if(!out && cg.source!=='ruta'){ shipRouteKm(pin).then(()=>{
      if(!draft.shipCalc||!draft.shipCalc.pin||_shipKey(draft.shipCalc.pin)!==_shipKey(pin)) return; // el pin cambió
      const kc=shipChargedKm(pin);
      draft.shipCalc={km:kc.km,cost:shipCost(kc.km),place,out:false,pin,source:kc.source};
      if(draft.shipAuto!==false) shipApplySuggested(true);
      shipHintPaint();
    }); }
  }catch(e){ draft.shipCalc={err:'Sin internet para calcular el envío'}; shipHintPaint(); }
}
function shipApplySuggested(silent){
  const c=draft.shipCalc; if(!c||c.out||c.err) return;
  draft.shipping=c.cost; draft.shipAuto=true;
  const e=$("#dShip"); if(e) e.value=c.cost;
  const dt=$("#draftTotal"); if(dt) dt.textContent=money(draftGrand());
  if(!silent){ shipHintPaint(); toast('Envío '+money(c.cost)); }
}
function shipHintHtml(){
  const c=draft.shipCalc;
  if(!c) return 'Escribí la colonia (o pegá el link de ubicación en la dirección) y calculo el envío solo.';
  if(c.err) return `${esc(c.err)}<button class="lnk" onclick="openShipMap()">buscar en el mapa</button>`;
  if(c.out) return `<b>${c.km.toFixed(1)} km</b> · fuera de zona (más de ${SHIP_CFG.max_km} km) · el precio se acuerda a mano
      <button class="lnk" onclick="openShipMap()">ver en el mapa</button>`;
  return `<b>~${c.km.toFixed(1)} km ${c.source==='ruta'?'por ruta':'por calle'}</b>${c.place?' · '+esc(c.place):''} · sugerido <b>${money(c.cost)}</b>
      ${draft.shipAuto===false?`<button class="lnk" onclick="shipApplySuggested()">usar ${money(c.cost)}</button>`:''}
      <button class="lnk" onclick="openShipMap()">ajustar en el mapa</button>`;
}
function shipHintPaint(){ const h=$("#shipHint"); if(h) h.innerHTML=shipHintHtml(); }

function openShipMap(){
  syncDraft(); _shipSheet=true;
  const c=draft.shipCalc;
  if(c&&c.pin){ shipPin=c.pin; shipPlace=c.place||''; } else { shipPin=null; shipPlace=(draft.zone||'').trim(); }
  $("#overlayHost").innerHTML=`<div class="overlay" onclick="if(event.target===this)closeShipMap()">
    <div class="sheet" style="max-width:520px">
      <div class="sheet-head"><span class="sh-name">Calcular envío</span>
        <button class="x" onclick="closeShipMap()" aria-label="Cerrar">${ic('x',16)}</button></div>
      <div class="sheet-body">${shipCalcHtml(true)}</div></div></div>`;
  shipMountMap(); shipWireSearch();
}
function closeShipMap(){
  _shipSheet=false;
  if(_shipMap){ try{_shipMap.remove();}catch(e){} _shipMap=null; _shipMark=null; _shipLine=null; }
  $("#overlayHost").innerHTML='';
  if(adminView==='nueva') initNueva();
}
function shipUseInDraft(){
  if(!shipPin){ toast('Primero ubicá el punto'); return; }
  const km=shipKm(shipPin);
  if(km>SHIP_CFG.max_km){ toast('Fuera de zona · el precio se pone a mano'); return; }
  const cg=shipChargedKm(shipPin), kmCalle=cg.km;
  draft.shipCalc={km:kmCalle,cost:shipCost(kmCalle),place:shipPlace,out:false,pin:shipPin,source:cg.source};
  draft.shipping=draft.shipCalc.cost; draft.shipAuto=true;
  _shipAutoLast='@'+shipPin.lat.toFixed(5)+','+shipPin.lng.toFixed(5); // no re-calcular encima de lo que acaba de elegir
  closeShipMap(); toast('Envío '+money(draft.shipping));
}

/* ----- RETENCIÓN (4 oct 2026) -----
   Solo lectura sobre allOrders(): nada se escribe y nada se manda solo. «Escribirle» abre WhatsApp con un texto
   que el admin edita y envía A MANO. Cliente = últimos 8 dígitos del teléfono (igual que Estadísticas). */
const RET_DIAS=30;          // umbral: «sin pedir hace más de N días»
const RET_MIN_COMPRAS=2;    // ventas válidas (_esVenta) para contar como cliente que podía volver
const RET_GUION='Hola {nombre}, hace rato no te vemos por El Torito. Esta semana tenemos {producto}. ¿Te apartamos algo?';
function retNoVuelven(){
  adminClientes(); // reconstruye _cliMap (mismo agrupado por teléfono y nombres editados que la pestaña Clientes)
  const today=dayStart(Date.now()), out=[];
  Object.values(_cliMap).forEach(c=>{
    if(c.baja || _phoneKey(c.phone).length!==8) return;        // de baja o sin teléfono con quién hablar
    const ventas=c.orders.filter(_esVenta); if(ventas.length<RET_MIN_COMPRAS) return;
    // último pedido = lo más reciente entre la última venta y cualquier comanda abierta (si hay una en curso, no es que no pida)
    const last=Math.max(...ventas.map(_refVenta),...c.orders.map(o=>o.createdAt||0));
    const dias=Math.round((today-dayStart(last))/86400000);
    if(dias>RET_DIAS) out.push({key:c.key,name:c.name,phone:c.phone,compras:ventas.length,last,dias});
  });
  return out.sort((a,b)=>(b.compras-a.compras)||(a.dias-b.dias));
}
function adminNoVuelven(){
  const r=retNoVuelven();
  return `<div class="view-head"><div><button class="back-btn btn-ic" onclick="go('resumen')">${ic('left',16)} Resumen</button><h2>Clientes que no vuelven</h2><div class="vh-sub">${r.length} sin pedir hace más de ${RET_DIAS} días · compraron ${RET_MIN_COMPRAS} veces o más</div></div></div>
    ${r.length?`<div class="olist">${r.map(c=>`<button class="ocard" onclick="retVerFicha('${c.key}')">
        <span class="obody"><span class="oname">${dispName(c.name)}</span>
          <span class="ometa">Último pedido ${esc(fechaCorta(c.last))} · hace ${c.dias} días</span></span>
        <span class="oright"><span class="ototal" style="font-size:14px">${c.compras} compras</span></span></button>`).join('')}</div>
      <div class="pp-note" style="margin-top:12px">Tocá un cliente para ver su ficha y escribirle. Si ya tiene una comanda abierta, no aparece aquí.</div>`
    :`<div class="empty-state"><div class="es-ic">${ic('user',40)}</div><p>Ningún cliente lleva más de ${RET_DIAS} días sin pedir.</p></div>`}
    <div style="height:24px"></div>`;
}
function retVerFicha(key){ adminClientes(); openClientProfile(key); }
let _retKey=null;
function retEscribir(key){
  const c=_cliMap[key]; if(!c) return; _retKey=key;
  const nom=isPhoneName(c.name)?'':String(c.name).trim().split(/\s+/)[0];
  const txt=RET_GUION.replace('{nombre}',nom).replace('Hola ,','Hola,');

function retErr(m){ const e=$("#retErr"); if(e) e.textContent=m; }
function retVolver(){ const k=_retKey; _retKey=null; if(k&&_cliMap[k]) openClientProfile(k); else closeSheet(); }
function retAbrirWA(){
  const c=_cliMap[_retKey]; const t=$("#retTxt"); if(!c||!t) return;
  const txt=t.value.trim();
  if(!txt){ retErr('Escribí el mensaje.'); return; }
  if(/\{[^}]*\}/.test(txt)){ retErr('Falta completar lo que está entre llaves, por ejemplo {producto}.'); t.focus(); return; }
  const k=_phoneKey(c.phone); if(k.length!==8){ retErr('Este cliente no tiene un teléfono válido.'); return; }
  window.open('https://wa.me/504'+k+'?text='+encodeURIComponent(txt),'_blank','noopener');
}
// «Hoy: N nuevos, N que volvieron»: nuevo = su primera venta es ese día; volvió = compró ese día y ya tenía ventas antes.
function retLineaCierre(sel,lbl,ventasDia){
  const ck=o=>_digits(o.phone).length>=8?_phoneKey(o.phone):_norm(o.clientName);
  const first={}; allOrders().filter(_esVenta).forEach(o=>{ const k=ck(o), t=_refVenta(o); if(k&&(first[k]==null||t<first[k])) first[k]=t; });
  const hoy=new Set(); ventasDia.forEach(o=>{ const k=ck(o); if(k) hoy.add(k); });
  let nu=0, vo=0; hoy.forEach(k=>{ if(dayStart(first[k])===sel) nu++; else vo++; });
  return `<div class="ret-line">${ic('user',15)}<span>${esc(lbl)}: <b>${nu}</b> nuevo${nu===1?'':'s'}, <b>${vo}</b> que ${vo===1?'volvió':'volvieron'}</span></div>`;
}

/* ----- CLIENTES (editables por el admin) ----- */
// Agrupa por TELÉFONO (últimos 8 dígitos); sin teléfono, por nombre. Los datos editados
// en la ficha del cliente (state.clients) mandan sobre lo derivado de las comandas.
let _cliMap={};
const BAJA_TAG='[BAJA] ';
const _isBaja=n=>String(n||'').startsWith(BAJA_TAG);
const _noteClean=n=>_isBaja(n)?String(n).slice(BAJA_TAG.length):(n||'');
let showBaja=false;
function toggleBaja(){ showBaja=!showBaja; renderAdmin(); window.scrollTo(0,0); }
function adminClientes(){
  const map={};
  // Índice nombre→teléfono: para fusionar pedidos viejos SIN teléfono con el cliente que sí lo tiene.
  const nameToPhone={};
  allOrders().forEach(o=>{ const k=_phoneKey(o.phone); if(k.length>=4) nameToPhone[_norm(o.clientName)]=k; });
  (state.clients||[]).forEach(c=>{ const k=_phoneKey(c.phone); if(k.length>=4) nameToPhone[_norm(c.name)]=k; });
  const keyOf=(phone,name)=>{ let k=_phoneKey(phone);
    if(k.length<4){ const byName=nameToPhone[_norm(name)]; if(byName) k=byName; } // sin tel → usar el del mismo nombre
    return k.length>=4 ? 'p'+k : 'n'+_norm(name); };
  // Los pedidos cancelados NO derivan un cliente (así, al eliminar un cliente, desaparece de la lista).
  allOrders().filter(o=>o.status!=='cancelada').forEach(o=>{ const k=keyOf(o.phone,o.clientName);
    if(!map[k]) map[k]={key:k,name:o.clientName,phone:o.phone,zone:o.zone,addr:o.addr,note:'',orders:[],total:0,prods:{}};
    if(o.phone && !map[k].phone) map[k].phone=o.phone; // rellenar tel desde el pedido que sí lo trae
    map[k].orders.push(o); if(_esVenta(o)) map[k].total+=fullTotal(o);
    o.items.forEach(it=>map[k].prods[it.name]=(map[k].prods[it.name]||0)+1); });
  (state.clients||[]).forEach(c=>{ const k=keyOf(c.phone,c.name);
    if(!map[k]) map[k]={key:k,name:c.name,phone:c.phone,zone:c.zone,addr:c.addr,note:c.note||'',orders:[],total:0,prods:{}};
    else { map[k].name=c.name||map[k].name; map[k].phone=c.phone||map[k].phone;
      map[k].zone=c.zone||map[k].zone; map[k].addr=c.addr||map[k].addr; map[k].note=c.note||''; } });
  Object.values(map).forEach(c=>{ c.baja=_isBaja(c.note); c.note=_noteClean(c.note); });
  _cliMap=map;
  // Los clientes web sin nombre van PRIMERO (para nombrarlos fácil); luego por total gastado.
  const allCls=Object.values(map).sort((a,b)=>(isPhoneName(b.name)-isPhoneName(a.name))||(b.total-a.total));
  const nBaja=allCls.filter(c=>c.baja).length;
  const cls=allCls.filter(c=>!!c.baja===showBaja); // v2: los dados de baja salen de la lista, no se borran
  const nSin=cls.filter(c=>isPhoneName(c.name)).length;
  const nWeb=cls.filter(c=>cuentaWeb(c.phone)).length;
  return `<div class="view-head"><div><h2>Clientes</h2><div class="vh-sub">${cls.length} clientes${showBaja?' dados de baja':''}${nWeb?` · <b>${nWeb}</b> con cuenta en la web`:''} · toca uno para ver su perfil</div></div></div>
    ${nSin?`<button class="carn-info namebanner" onclick="go('clientes')" style="cursor:default">${ic('user',15)} <span><b>${nSin}</b> cliente${nSin>1?'s':''} de la web sin nombre · tócalos abajo para nombrarlos</span></button>`:''}
    ${cls.length? `<div class="olist">${cls.map(c=>{
      const top=Object.entries(c.prods).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]).join(", ");
      const sinN=isPhoneName(c.name);
      return `<div class="card cli-card${sinN?' unnamed':''}" style="padding:14px;cursor:pointer" onclick="${sinN?`nameWebPrompt('${esc(c.phone||c.name)}')`:`openClientProfile('${c.key}')`}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
          <div style="min-width:0"><div style="font-weight:700;font-size:15.5px">${dispName(c.name)}${cuentaWeb(c.phone)?` <span class="chip webacc">${ic('user',11)} Cuenta web</span>`:''}</div>
            <div style="font-size:12.5px;color:var(--muted);margin-top:2px">${esc(c.phone||'—')} · ${esc(c.zone||'')}</div></div>
          <div style="display:flex;align-items:flex-start;gap:4px;flex:none">
            <div style="text-align:right"><div class="disp" style="font-weight:600;font-size:18px;color:var(--rojo)">${money(c.total)}</div>
              <div style="font-size:11px;color:var(--muted-2)">${c.orders.length} comandas</div></div>
            <button class="ce-icon" onclick="event.stopPropagation();openClientEdit('${c.key}')" aria-label="Editar cliente">${ic('edit',15)}</button>
          </div>
        </div>
        ${c.note?`<div style="font-size:12.5px;color:var(--muted);margin-top:9px;background:#F5F5F7;border-radius:9px;padding:7px 10px">${ic('note',13)} ${esc(c.note)}</div>`:""}
        ${top?`<div style="font-size:12.5px;color:var(--muted);margin-top:9px">Compra seguido: <b style="color:var(--ink)">${esc(top)}</b></div>`:""}
        ${sinN
          ? `<div class="cli-name-cta">${ic('user',14)} Ponerle nombre ${ic('right',13)}</div>`
          : `<div style="margin-top:9px;display:flex;align-items:center;gap:6px;color:var(--rojo);font-size:12.5px;font-weight:600">${ic('eye',14)} Ver perfil e historial ${ic('right',13)}</div>`}
      </div>`;}).join("")}</div>`
    : `<div class="empty-state"><div class="es-ic">${ic('user',40)}</div><p>${showBaja?'No hay clientes dados de baja.':'Aún no hay clientes.<br>Se crean solos al capturar comandas con teléfono.'}</p></div>`}
    ${(nBaja||showBaja)?`<button class="btn ghost block" style="margin-top:18px" onclick="toggleBaja()">${showBaja?'Volver a los clientes activos':'Ver clientes dados de baja ('+nBaja+')'}</button>`:''}`;
}

function askBajaClient(key){
  const c=_cliMap[key]; if(!c) return; const n=c.orders.length;
  $("#overlayHost").innerHTML=`<div class="overlay"><div class="confirm-box">
    <div class="cb-t">${c.baja?'¿Reactivar cliente?':'¿Dar de baja al cliente?'}</div>

    <div class="cb-row"><button class="btn ghost block" onclick="closeSheet()">Volver</button>
      <button class="btn red block" onclick="setBajaClient('${key}',${c.baja?'false':'true'})">${c.baja?'Sí, reactivar':'Sí, dar de baja'}</button></div>
  </div></div>`;
}
function setBajaClient(key,baja){
  const c=_cliMap[key]; if(!c){ closeSheet(); return; }
  const ph=_digits(c.phone);
  if(ph.length<4||!c.name){ closeSheet(); toast('Este cliente no tiene teléfono guardado: ponele uno en Editar para poder darlo de baja'); return; }
  if(!state.clients) state.clients=[];
  const i=state.clients.findIndex(x=>_phoneKey(x.phone)===_phoneKey(ph));
  const base=i>=0?state.clients[i]:{phone:ph,name:c.name,zone:c.zone||'',addr:c.addr||'',note:'',createdAt:Date.now()};
  const rec=Object.assign({},base,{note:(baja?BAJA_TAG:'')+_noteClean(base.note)});
  if(i>=0) state.clients[i]=rec; else state.clients.push(rec);
  saveClientsLocal();
  if(USE_SUPA) supa.from('clients').upsert(toRowC(rec)).then(({error})=>{ if(error) console.warn('client baja:',error.message); }); else save();
  c.baja=!!baja; closeSheet();
  toast(baja?'Cliente dado de baja':'Cliente reactivado', ()=>setBajaClient(key,!baja));
}
function saveClientEdit(){
  const g=id=>(($("#"+id)||{}).value||'').trim();
  const name=g('clName'), phone=g('clPhone'), zone=g('clZone'), addr=g('clAddr'), note=g('clNote');
  if(!name){ toast('El nombre no puede quedar vacío'); return; }
  const np=_digits(phone);
  if(np.length<8){ toast('Pon el teléfono completo (8 dígitos): es el ID del cliente'); return; }
  if(!state.clients) state.clients=[];
  const oldKey=currentCliEdit, newPk=_phoneKey(np);
  // si cambió el número, retirar el registro viejo (local y nube)
  if(oldKey && oldKey.startsWith('p') && oldKey.slice(1)!==newPk){
    const old=state.clients.find(x=>_phoneKey(x.phone)===oldKey.slice(1));
    state.clients=state.clients.filter(x=>_phoneKey(x.phone)!==oldKey.slice(1));
    if(USE_SUPA && old) supa.from('clients').delete().eq('phone',_digits(old.phone)).then(({error})=>{ if(error) console.warn('client delete:',error.message); });
  }
  const i=state.clients.findIndex(x=>_phoneKey(x.phone)===newPk);
  const wasBaja=!!(_cliMap[oldKey]&&_cliMap[oldKey].baja);
  const rec={phone:np, name, zone, addr, note:(wasBaja?BAJA_TAG:'')+note, createdAt:(i>=0?state.clients[i].createdAt:Date.now())};
  if(i>=0) state.clients[i]=rec; else state.clients.push(rec);
  saveClientsLocal();
  if(USE_SUPA) supa.from('clients').upsert(toRowC(rec)).then(({error})=>{ if(error) console.warn('client upsert:',error.message); });
  else save();
  currentCliEdit=null; closeSheet(); toast('Cliente guardado: '+name);
}

  const stuckCobrar=state.orders.filter(o=>o.status==='espera_pago' && stuckMin(o)>STUCK.espera_pago).sort((a,b)=>stuckMin(b)-stuckMin(a));

  return `<div class="view-head"><div><h2>Resumen</h2></div></div>

// Descarga las ventas del mes como CSV (abre directo en Excel; BOM para acentos/ñ).
function exportReporte(){
  const rows=ventasDelMes().sort((a,b)=>_refVenta(a)-_refVenta(b));
  if(!rows.length){ toast('No hay ventas este mes para exportar'); return; }
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const head=['Folio','Fecha','Hora','Cliente','Teléfono','Zona','Entrega','Método','Estado','Pagado','Productos','Libras','Subtotal (L)','Envío (L)','Total (L)'];
  const lines=[head.map(q).join(',')];
  let totLb=0;
  rows.forEach(o=>{ const d=new Date(_refVenta(o));
    const prods=o.items.map(it=>{ const qy=(it.weigh&&it.weight!=null)?it.weight:it.qty;
      return qy+' '+(it.unit==='Libra'?'lb':it.unit)+' '+it.name+(it.available?'':' (no disponible)'); }).join('; ');
    const lb=orderLibras(o); totLb+=lb;
    lines.push([o.folio, d.toLocaleDateString('es-HN'), d.toLocaleTimeString('es-HN',{hour:'2-digit',minute:'2-digit'}),
      o.clientName, o.phone||'', o.zone||'', isRetiro(o)?'Retiro':'Envío', payMethodLabel(payMethodOf(o)), STATUS[o.status]||o.status,
      o.paid?'Sí':'No', prods, (Math.round(lb*10)/10).toFixed(1), orderTotal(o).toFixed(2), (o.shipping||0).toFixed(2), fullTotal(o).toFixed(2)].map(q).join(','));
  });
  // fila de totales
  lines.push(['TOTAL','','','','','','','','','','', (Math.round(totLb*10)/10).toFixed(1),
    rows.reduce((s,o)=>s+orderTotal(o),0).toFixed(2), rows.reduce((s,o)=>s+(o.shipping||0),0).toFixed(2), rows.reduce((s,o)=>s+fullTotal(o),0).toFixed(2)].map(q).join(','));
  const dN=new Date();
  const blob=new Blob(["\ufeff"+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='ventas-torito-'+dN.getFullYear()+'-'+String(dN.getMonth()+1).padStart(2,'0')+'.csv';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
  toast('Reporte descargado · '+rows.length+' comandas');
}

function statsRange(p){
  const now=Date.now(), today=dayStart(now), day=86400000, end=now+1;
  if(p==='7'||p==='30'){ const n=+p, start=today-(n-1)*day; return {start,end,prev:{start:start-n*day,end:start},label:'Últimos '+n+' días'}; }
  if(p==='mes'){ const d=new Date(now), start=new Date(d.getFullYear(),d.getMonth(),1).getTime(),
      pStart=new Date(d.getFullYear(),d.getMonth()-1,1).getTime(), span=now-start;
    return {start,end,prev:{start:pStart,end:Math.min(pStart+span+1,start)},label:ST_MESES[d.getMonth()]+' '+d.getFullYear()+' · se compara con el mismo tramo del mes anterior'}; }
  const vs=allOrders().filter(_esVenta); const first=vs.length?Math.min(...vs.map(_refVenta)):today;

}

function statsDelta(cur,prev){

function statsBars(items,o={}){
  const mx=Math.max(1,...items.map(i=>i.val)), peak=items.reduce((b,i,ix)=>i.val>items[b].val?ix:b,0), dense=items.length>14;

    const hi=i.val>0&&ix===peak;

      <span class="st-v">${hi?esc(o.fmt?o.fmt(i.val):money(i.val)):''}</span>

function statsSplit(parts,o={}){

function statsRank(rows,fmt){ if(!rows.length) return '<div class="kempty">Sin datos</div>';
  const mx=rows[0][1]||1;
  return `<div class="rank st-rank">${rows.map(([k,v,sub],i)=>`<div class="rrow"><span class="rk-name">${esc(k)}${sub?`<small>${esc(sub)}</small>`:''}</span><span class="rbar"><i class="${i===0?'hi':''}" style="width:${Math.max(5,v/mx*100)}%"></i></span><span class="rv">${esc(fmt(v))}</span></div>`).join('')}</div>`; }
function statsCompute(p){
  const R=statsRange(p), all=allOrders();
  const inR=(ts,r)=>ts>=r.start&&ts<r.end;
  const ventas=all.filter(o=>_esVenta(o)&&inR(_refVenta(o),R));
  const prevV=R.prev?all.filter(o=>_esVenta(o)&&inR(_refVenta(o),R.prev)):null;
  const sum=a=>a.reduce((s,o)=>s+fullTotal(o),0);
  const total=sum(ventas), n=ventas.length, ticket=n?total/n:0;
  const pTotal=prevV?sum(prevV):null, pN=prevV?prevV.length:null, pTicket=prevV&&pN?pTotal/pN:(prevV?0:null);
  // serie por día / semana / mes
  const day=86400000, spanDays=Math.round((dayStart(R.end-1)-R.start)/day)+1;
  let series=[], every=1, gran='día';
  if(spanDays<=31){ for(let i=0;i<spanDays;i++){ const s=R.start+i*day, d=new Date(s);
      series.push({s,e:s+day,label:String(d.getDate()),title:ST_DOWS[d.getDay()]+' '+d.getDate()+' '+ST_MESES[d.getMonth()],val:0}); }
    every=spanDays>16?(spanDays>24?5:3):1; }
  else if(spanDays<=140){ gran='semana'; let s=R.start; while(s<R.end){ const d=new Date(s);
      series.push({s,e:s+7*day,label:d.getDate()+' '+ST_MESES[d.getMonth()],title:'Semana del '+d.getDate()+' '+ST_MESES[d.getMonth()],val:0}); s+=7*day; } every=Math.ceil(series.length/6); }
  else { gran='mes'; const d0=new Date(R.start); let y=d0.getFullYear(), m=d0.getMonth();
    while(new Date(y,m,1).getTime()<R.end){ const s=new Date(y,m,1).getTime(), e=new Date(y,m+1,1).getTime();
      series.push({s,e,label:ST_MESES[m],title:ST_MESES[m]+' '+y,val:0}); m++; if(m>11){m=0;y++;} } every=Math.ceil(series.length/8); }
  ventas.forEach(o=>{ const t=_refVenta(o); const b=series.find(x=>t>=x.s&&t<x.e); if(b) b.val+=fullTotal(o); });
  // día de la semana y hora (hora = cuándo hicieron el pedido)
  const dow=ST_DOW.map((_,i)=>({label:ST_DOWS[i],title:ST_DOW[i],val:0,n:0}));
  const hrs=Array.from({length:24},(_,h)=>({label:String(h),title:(h%12||12)+(h<12?' a. m.':' p. m.'),val:0,n:0}));
  ventas.forEach(o=>{ const d=new Date(_refVenta(o)).getDay(); dow[d].val+=fullTotal(o); dow[d].n++;
    const h=new Date(o.createdAt).getHours(); hrs[h].val++; });
  const dowOrd=[1,2,3,4,5,6,0].map(i=>dow[i]);
  // origen, entrega, zona, pago
  const web=ventas.filter(statsEsWeb), man=ventas.filter(o=>!statsEsWeb(o));
  const ret=ventas.filter(isRetiro), env=ventas.filter(o=>!isRetiro(o));
  const zones={}; env.forEach(o=>{ const z=(o.zone||'').trim()||'Sin zona'; (zones[z]=zones[z]||{v:0,n:0}); zones[z].v+=fullTotal(o); zones[z].n++; });
  const zoneRows=Object.entries(zones).sort((a,b)=>b[1].v-a[1].v).slice(0,6).map(([k,z])=>[k,z.v,z.n+' pedido'+(z.n!==1?'s':'')]);
  const efe=ventas.filter(o=>payMethodOf(o)==='efectivo'), tra=ventas.filter(o=>payMethodOf(o)!=='efectivo');
  // productos
  const byL={}, byLb={};
  ventas.forEach(o=>(o.items||[]).forEach(it=>{ const a=lineAmount(it); if(a) byL[it.name]=(byL[it.name]||0)+a;
    const lb=itemLibras(it); if(lb) byLb[it.name]=(byLb[it.name]||0)+lb; }));
  const top=(obj,k)=>Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,k);
  // clientes
  const ck=o=>_digits(o.phone).length>=8?_phoneKey(o.phone):_norm(o.clientName);
  const firstSale={}; all.filter(_esVenta).forEach(o=>{ const k=ck(o), t=_refVenta(o); if(k&&(firstSale[k]==null||t<firstSale[k])) firstSale[k]=t; });
  const cli={}; ventas.forEach(o=>{ const k=ck(o); if(!k) return; const c=cli[k]||(cli[k]={name:o.clientName,v:0,n:0}); c.v+=fullTotal(o); c.n++; if(!isPhoneName(o.clientName)) c.name=o.clientName; });
  const cliKeys=Object.keys(cli), nuevos=cliKeys.filter(k=>firstSale[k]>=R.start), recur=cliKeys.length-nuevos.length;
  const topCli=Object.values(cli).sort((a,b)=>b.v-a.v).slice(0,5).map(c=>[isPhoneName(c.name)?'Sin nombre · '+c.name:c.name,c.v,c.n+' pedido'+(c.n!==1?'s':'')]);
  // ciclo (hist) — solo etapas con marca de tiempo en ambos extremos; se descartan negativos y > 7 días
  const firstAt=(o,s)=>{ const h=(o.hist||[]).find(x=>x.s===s); return h?+h.at:null; };
  const stages=[['Pedido → cotizado',o=>[o.createdAt,firstAt(o,'espera_pago')??firstAt(o,'preparacion')]],
    ['Cotizado → pagado',o=>[firstAt(o,'espera_pago'),o.paidAt?+o.paidAt:null]],
    ['Pagado → lista',o=>[o.paidAt?+o.paidAt:null,o.listaAt?+o.listaAt:firstAt(o,'lista')]],
    ['Lista → entregada',o=>[o.listaAt?+o.listaAt:firstAt(o,'lista'),firstAt(o,'entregada')]],
    ['Pedido → entregada (total)',o=>[o.createdAt,firstAt(o,'entregada')]]];
  const cycle=stages.map(([label,f])=>{ const d=[]; ventas.forEach(o=>{ const [a,b]=f(o); if(a!=null&&b!=null&&b>=a&&(b-a)<7*day) d.push((b-a)/60000); });
    d.sort((x,y)=>x-y); return {label,n:d.length,avg:d.length?d.reduce((s,x)=>s+x,0)/d.length:null,med:d.length?d[Math.floor(d.length/2)]:null}; });
  // cancelación: sobre las comandas CREADAS en el período
  const created=all.filter(o=>inR(o.createdAt,R)), canc=created.filter(o=>o.status==='cancelada');
  return {R,ventas,n,total,ticket,pTotal,pN,pTicket,series,every,gran,dowOrd,hrs,web,man,ret,env,zoneRows,efe,tra,
    prodL:top(byL,6),prodLb:top(byLb,6),nuevos:nuevos.length,recur,topCli,cycle,created:created.length,canc:canc.length,sum,
    lb:ventas.reduce((s,o)=>s+orderLibras(o),0)};
}

/* ----- CIERRE DE CAJA (cuadre del día) -----
   El método de pago se DEDUCE del tipo de entrega (regla del negocio, confirmada por Ivan):
   Retiro en local = efectivo · Domicilio = transferencia. Sin excepciones → sin campo en la BD. */
const payMethodOf=o=>isRetiro(o)?'efectivo':'transferencia';

function adminCierre(){
  const now=Date.now(), today=dayStart(now), day=86400000;

  let efe=0, tra=0, nEfe=0, nTra=0;
  ventas.forEach(o=>{ const t=fullTotal(o); if(payMethodOf(o)==='efectivo'){efe+=t;nEfe++;} else {tra+=t;nTra++;} });
  const total=efe+tra;
  const lbl=isToday?'Hoy':(sel===today-day?'Ayer':new Date(sel).toLocaleDateString('es-HN',{weekday:'long',day:'numeric',month:'long'}));

    </div>

      <div class="field" style="margin-top:10px"><label for="cashCount">Efectivo contado (lo que hay en la caja)</label>

      <div class="kv" id="cuadreDiff" style="margin-top:6px"><span class="k">Diferencia</span><span class="v">—</span></div>
      <div class="pp-note" style="margin-top:8px">Solo es una ayuda para cuadrar al cierre; no se guarda.</div>
    </div>

function updateCuadre(esperado){
  const raw=(($("#cashCount")||{}).value||'').replace(',','.');
  const el=$("#cuadreDiff"); if(!el) return;
  if(raw.trim()===''){ el.innerHTML=`<span class="k">Diferencia</span><span class="v">—</span>`; return; }
  const v=parseFloat(raw)||0, diff=v-esperado, ok=Math.abs(diff)<0.005;
  const color= ok ? 'var(--ok)' : (diff<0 ? '#b03a3a' : '#8A5A11');
  el.innerHTML=`<span class="k">Diferencia</span><span class="v" style="color:${color};font-weight:700">${diff>0?'+':''}${money(diff)}${ok?' ✓ cuadra':(diff<0?' (falta)':' (sobra)')}</span>`;
}

// Bloques que se inyectan en la plantilla del mensaje (variables {pedido} {totales} {pago}).
function orderLinesBlock(o){
  const av=(o.items||[]).filter(i=>i.available), un=(o.items||[]).filter(i=>!i.available);
  let s='';
  av.forEach(it=>{ const q=(it.weigh&&it.weight!=null)?it.weight:it.qty; const nm=it.name.replace(/\s*\(paquete\)/i,'');
    s+=`${q} ${unitWord(it.unit,q)} de ${nm} .... ${moneyWA(lineAmount(it))}\n`; });
  un.forEach(it=>{ s+=`${it.name} .... hoy no disponible\n`; });
  return s.replace(/\n+$/,'');
}
function totalsBlock(o){
  let s=`*Subtotal: ${moneyWA(orderTotal(o))}*`;
  if(o.shipping) s+=`\nEnvío .... ${moneyWA(o.shipping)}`;
  return s+`\n*Total a pagar: ${moneyWA(fullTotal(o))}*`;
}
// {pedido} = los productos con precios + subtotal/envío/total (todo lo que cambia por pedido).
function orderBlock(o){ return orderLinesBlock(o) + `\n\n` + totalsBlock(o); }
// El mensaje es texto libre (biz.msg); solo se reemplazan {name} y {pedido}.
function waMessage(o){
  const nm0=(o.clientName||'').trim().split(/\s+/)[0]||'';
  const tpl=(biz.msg||BIZ_DEFAULTS.msg);
  const hasFolio=/\{folio\}|\{pedido#\}|\{id\}/i.test(tpl); // ¿la plantilla ya trae el identificador?
  let msg=tpl
    .replace(/\{folio\}|\{pedido#\}|\{id\}/gi, o.folio||'')
    .replace(/\{name\}|\{nombre\}|\{cliente\}/gi, nm0)
    .replace(/\{pedido\}|\{productos\}/gi, orderBlock(o))
    .replace(/\{entrega\}/gi, entregaLine(o))
    .replace(/ {2,}/g,' '); // "Hola  👋" (sin nombre) → "Hola 👋"
  // Si el mensaje personalizado no incluye el folio, lo agregamos arriba para que el admin
  // pueda ubicar la comanda (búsqueda por folio en la Bandeja).
  if(!hasFolio && o.folio) msg = `*Pedido #${o.folio}*\n\n` + msg;
  return msg;
}
function repartidorFicha(o){
  // La dirección puede traer el link de ubicación embebido (lo manda la tienda web: "… · 📍 Ubicación: <maps>").
  // Lo separamos en su propia línea para que el repartidor lo abra de un toque; sin link (pedido manual) queda limpio.
  var raw=(o.addr||o.zone||'').trim();
  var link='', addr=raw;
  var m=raw.match(/https?:\/\/\S+/);
  if(m){
    link=m[0];
    var cut=raw.search(/·?\s*📍|Ubicaci[oó]n\s*:/i);
    addr=(cut>=0?raw.slice(0,cut):raw.replace(link,'')).replace(/[·•\s]+$/,'').trim();
  }
  var L=['🛵 Entrega · Pedido '+(o.folio||''),
    'Cliente: '+(o.clientName||'—'),
    'Teléfono: '+(o.phone||'—'),
    'Dirección: '+(addr||'—')];
  if(link) L.push('📍 Ubicación: '+link);
  return L.join('\n');
}
function markPaid(id){ const o=orderById(id); if(!o) return; o.paid=true; o.paidAt=Date.now(); setStatus(o,"preparacion"); save(o); closeSheet(); toast("Pagado · pasó a preparación", ()=>revertStatus(id, x=>{x.paid=false; x.paidAt=null;})); }
// RETIRO — poner en espera: entra a "En preparación" PERO en pausa (held), sin pagar (paga efectivo al retirar).
function holdForPickup(id){ const o=orderById(id); if(!o) return; o.held=true; setStatus(o,"preparacion"); save(o); closeSheet();
  toast("En espera de retiro · se prepara cuando el cliente llegue", ()=>revertStatus(id, x=>{x.held=false;})); }
// RETIRO — el cliente llegó (manual, no por la hora): saca la pausa → preparación activa.
function arriveForPickup(id){ const o=orderById(id); if(!o) return; if(!o.held){ closeSheet(); if(session.role==='carnicero') openCarniceroOrder(id); return; }
  o.held=false; save(o); closeSheet(); rerender();
  const un=()=>{ const x=orderById(id); if(x){ x.held=true; save(x); rerender(); } };
  toast("#"+o.folio+" · cliente llegó, a preparar", un);
  if(session.role==='carnicero') openCarniceroOrder(id); }
// RETIRO — entregar en el mostrador y cobrar en efectivo.
function deliverPickup(id){ const o=orderById(id); if(!o) return; o.paid=true; o.paidAt=Date.now(); setStatus(o,"entregada"); save(o); closeSheet();
  toast("Entregado y cobrado (efectivo)", ()=>revertStatus(id, x=>{x.paid=false; x.paidAt=null;})); }
function returnToCotizar(id){ const o=orderById(id); if(!o) return; setStatus(o,"cotizar"); save(o); closeSheet(); toast("Devuelta a cotización", ()=>revertStatus(id)); }
function sendRepartidor(id){ const o=orderById(id); if(!o) return; const f=repartidorFicha(o);
  // open a sub view in sheet
  sheet(o,`<div class="sect-label" style="margin-top:0">Ficha para el repartidor</div>

    <button class="btn lg block btn-ic" style="margin-top:10px" onclick="waSendRepartidor('${o.id}')">${ic('send',18)} Enviar por WhatsApp</button>
    <button class="btn ghost block sm" style="margin-top:8px" onclick="copy(document.getElementById('ficha').innerText);this.innerHTML='Copiado'">${ic('copy',16)} Copiar ficha</button>
    <button class="btn green lg block" style="margin-top:10px" onclick="confirmRuta('${o.id}')">${ic('truck',18)} Enviado al repartidor</button>`);

function confirmRuta(id){ const o=orderById(id); if(!o) return; setStatus(o,"en_ruta"); save(o); closeSheet(); toast("Comanda en ruta", ()=>revertStatus(id)); }
function markDelivered(id){ const o=orderById(id); if(!o) return; setStatus(o,"entregada"); save(o); closeSheet(); toast("Comanda entregada", ()=>revertStatus(id)); }

/* ================= CARNICERO v2 ================= */
const C_COLS=[["c1","Por cotizar","cotizar"],["c2","Espera pago","espera_pago"],["c3","En preparación","preparacion"],["c4","Lista p/ entrega","lista"]];
const C_ICON={cotizar:'edit',espera_pago:'clock',preparacion:'knife',lista:'check'}; // el estado se lee por forma, no solo por color
const _seenCards=new Set(); let _seenReady=false, _freshIds=new Set();
const C_ORDER=["cotizar","espera_pago","preparacion","lista"];
const C_EMPTY={cotizar:"Nada por cotizar",espera_pago:"Nada en espera",preparacion:"Nada en preparación",lista:"Nada listo aún"};
// Firma ligera del tablero: si nada visible cambió, NO se reconstruye el DOM (menos trabajo
// en el iPad y menos ventanas donde un tap pueda caer en un botón recién destruido).
// Incluye el minuto actual para que los "hace X min" se refresquen solos.
let _carnSigLast='';
function _carnSig(){ return Math.floor(Date.now()/60000)+'~'+soundOn+'~'+pushOn+'~'+
  state.orders.filter(o=>C_ORDER.includes(o.status)).map(o=>[o.id,o.status,o.paid?1:0,o.held?1:0,o.items.filter(i=>!i.available).length,o.clientName,o.note||'',o.items.length,fullTotal(o),o.createdAt].join('|')).join(';'); }
/* ===== PAGER DE ESTACIONES (carnicero, móvil): cada estación = pantalla completa,
   se cambia con swipe (snap nativo) o tocando la tab. La "estación actual" se guarda como
   ESTADO (carnStation), así el refresco de cada minuto no te patea de vuelta a la primera. ===== */
let carnStation=0; // 0..3 — estación visible en el pager
const CARN_TABS=[["Cotizar","cotizar"],["Pago","espera_pago"],["Preparar","preparacion"],["Listas","lista"]];
function carnColsHtml(){
  _freshIds=new Set(); if(_seenReady) state.orders.forEach(o=>{ if(C_ORDER.includes(o.status)&&!_seenCards.has(o.id)) _freshIds.add(o.id); }); // comandas que acaban de entrar
  const html=C_COLS.map(([cls,label,st])=>{
    const arr=state.orders.filter(o=>o.status===st);
    if(st==='cotizar') arr.sort((a,b)=>a.createdAt-b.createdAt); // FIFO: el más viejo arriba
    const urge=(st==='cotizar'||st==='preparacion')&&arr.length?' urge':'';
    return `<div class="kcol ${cls}${urge} ${(st==='cotizar'&&alertC1)||(st==='preparacion'&&alertC3)?'alerted':''}" id="col${cls.toUpperCase()}">
      <div class="kcol-head"><span class="kn">${ic(C_ICON[st],20)} ${label}</span><span class="kc">${arr.length}</span></div>
      <div class="kcol-body">
        ${arr.length?arr.map(o=>kcard(o,st)).join(""):Kd.vacio(st,C_EMPTY[st],'check',1)}
      </div></div>`;
  }).join("");
  state.orders.forEach(o=>_seenCards.add(o.id)); _seenReady=true;
  return html;
}
function carnTabsHtml(){
  return CARN_TABS.map(([lbl,st],i)=>{ const n=state.orders.filter(o=>o.status===st).length;
    return `<button class="ctab ${i===carnStation?'on':''}" onclick="carnGoStation(${i})" aria-label="${esc(lbl)}, ${n} comandas">
      <span class="ctab-c ${n?'has':''}">${n}</span><span class="ctab-l">${lbl}</span></button>`;
  }).join("")+`<span class="ctab-ind" id="ctabInd"></span>`;
}
function carnUpdateTabCounts(){ const tb=$("#carnTabs"); if(!tb) return; const cs=tb.querySelectorAll('.ctab-c');
  CARN_TABS.forEach(([lbl,st],i)=>{ const c=cs[i]; if(c){ const n=state.orders.filter(o=>o.status===st).length; Mo.num(c,n); c.classList.toggle('has',!!n); } }); }
function _carnSetActiveTab(idx){ const tb=$("#carnTabs"); if(tb) tb.querySelectorAll('.ctab').forEach((b,i)=>b.classList.toggle('on',i===idx)); }
// Tocar una tab → deslizar suave a esa estación (respeta "reducir movimiento").
function carnGoStation(i){ i=Math.max(0,Math.min(C_COLS.length-1,i)); carnStation=i;
  const k=$("#carnKanban"); if(k){ const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
    k.scrollTo({left:i*k.clientWidth, behavior:rm?'auto':'smooth'}); }
  _carnSetActiveTab(i); }
// El indicador (subrayado rojo) sigue el swipe 1:1; la tab activa cambia al pasar el medio.
function _carnIndicator(){ const k=$("#carnKanban"), ind=$("#ctabInd"), tb=$("#carnTabs");
  if(!k||!ind||!tb) return; const w=k.clientWidth||1;
  const frac=Math.max(0,Math.min(C_COLS.length-1,k.scrollLeft/w));
  ind.style.transform=`translateX(${frac*(tb.clientWidth/C_COLS.length)}px)`;
  const active=Math.round(frac); carnStation=active; _carnSetActiveTab(active); }
let _carnRAF=0;
function _carnWirePager(){ const k=$("#carnKanban"); if(!k||k._paged) return; k._paged=1;
  k.addEventListener('scroll',()=>{ if(_carnRAF) return; _carnRAF=requestAnimationFrame(()=>{ _carnRAF=0; _carnIndicator(); }); },{passive:true});
  requestAnimationFrame(()=>{ k.scrollLeft=carnStation*k.clientWidth; _carnIndicator(); }); }
function renderCarnicero(){
  document.body.classList.add('carn-mode'); // clava la vista a 100dvh (solo aplica en móvil, ver CSS)
  // aviso de comanda nueva: si crecen las "por cotizar", suena + pulso en la columna
  const cotizarCount = state.orders.filter(o=>o.status==='cotizar').length;
  if(prevCotizar!==null && cotizarCount>prevCotizar){ playDing(); alertC1=true; setTimeout(()=>{alertC1=false; const c=$("#colC1"); if(c) c.classList.remove('alerted');},1800); }
  prevCotizar=cotizarCount;
  // Aviso al carnicero cuando el ADMIN marca PAGADO → la comanda entra a "En preparación" y ya puede prepararla.
  const prepCount = state.orders.filter(o=>o.status==='preparacion' && !o.held).length; // en pausa (retiro) no cuenta como "a preparar"
  if(prevPreparacion!==null && prepCount>prevPreparacion){ playDing(); alertC3=true; setTimeout(()=>{alertC3=false; const c=$("#colC3"); if(c) c.classList.remove('alerted');},1800); }
  prevPreparacion=prepCount;
  const sig=_carnSig();
  if(sig===_carnSigLast){ updateClock(); return; }
  _carnSigLast=sig;
  const _existK=$("#carnKanban");
  if(_existK){ // REFRESCO EN EL LUGAR: no se destruye el contenedor del scroll → la estación se conserva
    const x=_existK.scrollLeft; _existK.innerHTML=carnColsHtml(); _existK.scrollLeft=x;
    carnUpdateTabCounts(); _carnIndicator(); updateClock(); return;
  }
  $("#app").innerHTML =
   `<div class="ctop">
      <div class="ctop-brand ctop-brand-h"><img src="assets/torito-badge.png" class="ctop-badge" alt=""><img src="assets/torito-wordmark.svg" class="ctop-logo" alt="El Torito Carnicería"><span class="ctop-role">PRODUCCIÓN</span></div>
      <button class="ctop-snd" onclick="openSoundSheet()" aria-label="Ajustes">${ic('gear',19)}</button>
      <button class="ctop-push ${pushOn?'on':''}" onclick="togglePush()" aria-label="${pushOn?'Avisos activados':'Activar avisos'}">${ic(pushOn?'bell':'belloff',18)}<span class="cp-lbl">${pushOn?'Avisos ON':'Activar avisos'}</span></button>
      <button class="ctop-sync" id="syncBtn" onclick="manualSync()" aria-label="Actualizar tablero">${ic('sync',16)}<span id="syncClock">actualizado ahora</span></button>
   </div>
   <div class="carn-tabs" id="carnTabs">${carnTabsHtml()}</div>
   <div class="kanban-wrap">
     <div class="kanban" id="carnKanban">${carnColsHtml()}</div>
   </div>`;
  _carnWirePager();
  updateClock();
}
// Lista compacta de productos para las tarjetas del tablero (qty · nombre · importe). Máx 6 + "N más".
function cardItemsHtml(o,big){ const its=o.items||[]; if(!its.length) return '';

function cardTotalHtml(o){ return `<div class="ktotrow"><span class="tl">Total${o.shipping?' · con envío':''}</span><span class="tv">${money(fullTotal(o))}</span></div>`; }
// Chip de método de pago (solo admin: el carnicero no maneja el cobro).
function cardPayChip(o){ const m=payMethodOf(o); return `<span class="kpaychip ${m==='efectivo'?'efec':'tran'}">${ic(m==='efectivo'?'cash':'send',12)} ${payMethodLabel(m)}</span>`; }
function kcard(o,st){
  let footer='';
  if(st==='cotizar') footer=`<button class="kmv fwd" onclick="event.stopPropagation();openCarniceroOrder('${o.id}')">${ic('edit',17)} Cotizar</button>`;
  else if(st==='espera_pago') footer=`<button class="kmv" onclick="event.stopPropagation();openCarniceroOrder('${o.id}')">${ic('edit',17)} Editar pedido</button>`;

// La comanda se muestra AGRUPADA POR CATEGORÍA (Res→Cerdo→Pollo→Embutidos→Extras→Vísceras) y

const CAT_ORDER=['Res','Cerdo','Pollo','Embutidos','Extras','Vísceras'];

function oitemSequence(vo){

    const ra=catRank(itemCat(editItems[a])), rb=catRank(itemCat(editItems[b]));
    if(ra!==rb) return ra-rb;
    if(!vo){ const wa=(editItems[a].weigh&&editItems[a].available)?0:1, wb=(editItems[b].weigh&&editItems[b].available)?0:1; if(wa!==wb) return wa-wb; }

    const bx=$("#nb"+activeEdit.i); if(bx && activeEdit.field!=='price') bx.childNodes[0].textContent=(activeEdit.buffer||'—');
    const pb=$("#pb"+activeEdit.i); if(pb && activeEdit.field==='price') pb.childNodes[0].textContent='L'+(activeEdit.buffer||'');
    const am=$("#amt"+activeEdit.i); if(am) am.textContent=money(itemAmt(it));
  }
  updateSummary();
  const nt=$("#npTotal"); if(nt) nt.textContent=money(editGrand());
}
// Siguiente línea de la fase COTIZAR que aún necesita peso o precio (en el orden en que se ve), y al final el envío.
function nextTarget(){
  if(!curCotizar||!activeEdit||!editItems) return null;
  const pend=(it,skipW)=>it.available && ((it.weigh&&!it._wtouched&&!skipW)?'weight':(it.price==null?'price':null));
  const order=oitemSequence(false).filter(e=>e.i!==undefined).map(e=>e.i);
  const cur=activeEdit.i;
  if(cur>=0){ const it=editItems[cur]; if(activeEdit.field==='weight'&&it.available&&it.price==null) return {i:cur,field:'price'};
    const p=order.indexOf(cur);
    for(let k=p+1;k<order.length;k++){ const f=pend(editItems[order[k]]); if(f) return {i:order[k],field:f}; } }
  else { return null; }
  if(needShip()) return {i:-1,field:'ship'};
  return null;
}
function commitEdit(){
  persistEdits();
  const nx=nextTarget();
  if(nx){ activeEdit=null; rerenderOitems(); startEdit(nx.i,nx.field); return; } // "Listo · siguiente": salta a lo que falta
  closeNumpad();
}
function closeNumpad(){ if(activeEdit&&editItems&&!adminEditMode&&!curSheetVO) persistEdits(); activeEdit=null; const h=$("#numpadHost"); if(h) h.innerHTML=''; rerenderOitems(); }
function persistEdits(noSave){ const o=orderById(currentSheetId); if(!o) return;
  o.items=editItems.map(it=>{ const {_bad,...r}=it; return {...r, weight: it.weigh?(it.weight!=null?it.weight:it.qty):null}; });
  o.shipping=editShipping; o.note=editComment; if(!noSave) save(o); }
function confirmCotizarV2(){ const o=orderById(currentSheetId); if(!o) return;
  // No dejar avanzar sin haber validado el peso de los productos que lo requieren.
  const faltan=editItems.filter(it=>it.available && it.weigh && !it._wtouched);
  if(faltan.length){ haptic('warn'); toast('Valida el peso de: '+faltan.map(f=>f.name).join(', '));
    faltan.forEach(f=>{ f._bad='Falta validar el peso'; }); rerenderOitems(); faltan.forEach(f=>Mo.shake($('#nb'+editItems.indexOf(f))));
    const idx=editItems.indexOf(faltan[0]); if(idx>=0) startEdit(idx,'weight'); return; }
  // Red de seguridad: un "por encargo" (sin precio) no puede pasar a pago en L0 — se le pone el precio negociado.
  const faltanPrecio=editItems.filter(it=>it.available && it.price==null);
  if(faltanPrecio.length){ haptic('warn'); toast('Ponle precio a: '+faltanPrecio.map(f=>f.name).join(', '));
    faltanPrecio.forEach(f=>{ f._bad='Falta el precio'; }); rerenderOitems(); faltanPrecio.forEach(f=>Mo.shake($('#pb'+editItems.indexOf(f))));
    const idx=editItems.indexOf(faltanPrecio[0]); if(idx>=0) startEdit(idx,'price'); return; }
  // Ni sin confirmar de un toque lo que no se pesa.
  const faltanConf=editItems.filter(it=>it.available && !it.weigh && !it._confirmed);
  if(faltanConf.length){ haptic('warn'); toast('Confirma lo que no se pesa: '+faltanConf.map(f=>f.name).join(', '));
    faltanConf.forEach(f=>{ f._bad='Falta confirmar que lo tenés'; }); rerenderOitems(); document.querySelectorAll('.okbox.bad').forEach(b=>Mo.shake(b)); return; }
  // Envío obligatorio en domicilio: no pasa a pago con envío en 0 ("a convenir" de un pedido
  // web sin ubicación). Se le pone el precio a mano antes de cotizar.
  if(!isRetiro(o) && !(editShipping>0)){ haptic('warn'); toast('Ponle el precio del envío antes de cotizar'); Mo.shake($('#srShip')); startEdit(-1,'ship'); return; }
  const id=o.id; persistEdits(true); setStatus(o,'espera_pago'); save(o); haptic('success');
  notifyAdmin('💵 Por cobrar #'+o.folio, o.clientName+' · '+money(fullTotal(o))); // avisa al admin
  closeCarn(); toast('Pasó a confirmación de pago', ()=>revertStatus(id)); }
function guardarV2(){ persistEdits(); closeCarn(); toast('Cambios guardados'); }
function markReady(id){ const o=orderById(id); if(!o) return; const prevLista=o.listaAt; o.listaAt=Date.now(); setStatus(o,'lista'); save(o); haptic('success');
  notifyAdmin('📦 Por entregar #'+o.folio, o.clientName+' · '+(isRetiro(o)?'Retiro':'Domicilio'+(o.zone?' · '+o.zone:''))); // avisa al admin
  closeCarn(); toast('Listo para entrega', ()=>revertStatus(id, x=>{x.listaAt=prevLista;})); }
function closeCarn(){ if(editItems&&!adminEditMode&&!curSheetVO&&currentSheetId) persistEdits(); // cerrar la hoja guarda el borrador (antes se perdía lo tecleado)
  $("#overlayHost").innerHTML=''; const h=$("#numpadHost"); if(h) h.innerHTML=''; activeEdit=null; editItems=null; currentSheetId=null; adminEditMode=false; _openOrderId=null; _coEditTrack(); rerender(); }
/* add product mid-process */
let addCat="Res";
function openAddProduct(){
  closeNumpad();
  $("#overlayHost").insertAdjacentHTML('beforeend',`<div class="overlay" id="addOv" onclick="if(event.target===this)closeAdd()">
    <div class="sheet" style="max-width:560px"><div class="sheet-head"><span class="sh-name">Agregar producto</span><button class="x" onclick="closeAdd()">${ic('x',16)}</button></div>
    <div class="sheet-body"><div class="cat-tabs" id="addTabs"></div><div class="prod-grid" id="addGrid"></div></div></div></div>`);
  renderAddGrid();
}
function renderAddGrid(){
  const t=$("#addTabs"); if(t) t.innerHTML=CAT.map(g=>`<button class="${addCat===g.cat?'on':''}" onclick="addCat='${g.cat}';renderAddGrid()">${g.cat}</button>`).join('');
  const g=$("#addGrid"); if(!g) return;
  // Los "por encargo" (sin precio de catálogo) NO se piden por la app: se atienden por WhatsApp
  // y se negocia el precio. Se ocultan del grid para que no se carguen como comanda.
  const items=PRODUCTS.filter(p=>p.cat===addCat && !p.disabled && p.price!=null);
  g.innerHTML=items.length
    ? items.map(p=>`<button class="pchip" onclick="pickAdd('${p.id}')"><div class="pn">${esc(p.name)}</div><div class="pp">${money(p.price)}<span class="pu"> /${p.unit==='Libra'?'lb':p.unit==='Unidad'?'u':p.unit}</span></div></button>`).join('')
    : `<div class="kempty" style="grid-column:1/-1">No hay productos para pedir en esta categoría.</div>`;
}
function pickAdd(id){ const p=prodById(id);
  editItems.push({prodId:p.id,name:p.name,unit:p.unit,price:p.price,weigh:p.weigh,qty:1,available:true,weight:p.weigh?1:null,note:''});
  persistEdits(); closeAdd(); rerenderOitems(); updateSummary(); toast(p.name+' agregado'); }
function closeAdd(){ const a=$("#addOv"); if(a) a.remove(); }

/* ================= SHEET ================= */
let currentSheetId=null;
function sheet(o,bodyHtml,titleOverride){
  currentSheetId=o.id;
  $("#overlayHost").innerHTML=`<div class="overlay" onclick="if(event.target===this)closeSheet()">
    <div class="sheet"><div class="sheet-head">
      <span class="sh-folio">#${o.folio}</span>
      <span class="sh-name">${dispName(o.clientName)}</span>
      ${!titleOverride?`<span class="chip ${CHIP[o.status]}" style="margin-left:4px">${STATUS[o.status]}</span>`:''}
      <button class="x" onclick="closeSheet()">${ic('x',16)}</button>
    </div><div class="sheet-body">${bodyHtml}</div></div></div>`;
}
function closeSheet(){ $("#overlayHost").innerHTML=""; currentSheetId=null; editItems=null; rerender(); }

/* ============ INIT ============ */
if(window.supabase && SUPA_URL){ initSupa().catch(e=>{ ctSessOff(); console.warn('Supabase init falló, modo local:',e); USE_SUPA=false; load(); archiveStaleListas(); }); }
else { ctSessOff(); USE_SUPA=false; load(); archiveStaleListas(); }
// Si no cargó la nube, avisar ANTES de entrar (el modo local es demostración: no ve ni guarda pedidos reales).
setTimeout(()=>{ const w=$("#cloudWarn"); if(w && !USE_SUPA) w.textContent="Sin conexión a la nube — modo de demostración. Los pedidos reales NO se verán aquí; revisa el internet y recarga."; },1500);

// Marca <html class="ov-open"> mientras haya una hoja/modal abierta → el CSS pausa las
// animaciones del tablero de fondo (taps más fluidos en iPad). Centralizado con un observer
// para cubrir todos los caminos de abrir/cerrar (sheets, confirmaciones, editor, numpad).
new MutationObserver(()=>{ document.documentElement.classList.toggle('ov-open', $("#overlayHost").children.length>0); })
  .observe($("#overlayHost"),{childList:true});

/* ===== PWA: instalable + offline + AUTO-ACTUALIZACIÓN =====
   La app se actualiza SOLA a la última versión (nadie descarga ni toca nada), pero
   recarga únicamente cuando es SEGURO: nunca en medio de una cotización, con una hoja
   abierta, con el teclado numérico o mientras alguien escribe. Si está ocupado, espera. */
if('serviceWorker' in navigator){
  const _wasControlled = !!navigator.serviceWorker.controller; // ¿la página ya venía servida por un SW?
  let _autoUpdating=false;
  const _busy=()=>{
    if(typeof activeEdit!=='undefined' && activeEdit) return true;               // numpad / edición activa
    const ov=$("#overlayHost"); if(ov && ov.innerHTML.trim()!=='') return true;  // hoja / modal abierto
    const np=$("#numpadHost");  if(np && np.innerHTML.trim()!=='') return true;  // teclado numérico abierto
    const ae=document.activeElement; if(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return true; // escribiendo
    return false;
  };
  const _safeReload=()=>{
    if(_busy()){ setTimeout(_safeReload, 6000); return; }   // ocupado → reintentar en 6s
    try{ toast('Actualizando a la última versión…'); }catch(_){}
    setTimeout(()=>location.reload(), 700);
  };
  // Un SW nuevo tomó control = hay deploy nuevo → recargar solo (si la página ya estaba controlada).
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(!_wasControlled || _autoUpdating) return;
    _autoUpdating=true; _safeReload();
  });
  const _checkUpd=()=>{ navigator.serviceWorker.getRegistration().then(r=>{ if(r) r.update().catch(()=>{}); }).catch(()=>{}); };
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').then(()=>_checkUpd()).catch(()=>{}); });
  setInterval(_checkUpd, 4*60*1000);                                              // revisa cada 4 min
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) _checkUpd(); }); // y al volver a primer plano
}
</script>
